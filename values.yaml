# EVtivity CSMS Helm Chart Values

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/evtivity/evtivity-csms
  # Accepts semver eg: "1.2.3", defaults to Chart.appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# --- API Service ---
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7102
  env:
    logLevel: info
    nodeEnv: production
    corsOrigin: ""
    rateLimitMax: 3000
    rateLimitWindow: "1 minute"
    authRateLimitMax: 30
    authRateLimitWindow: "1 minute"
    metricsPort: "9091"
    cookieDomain: ""
    # Public wss:// address stations use for security profiles 2 and 3, without the
    # station ID. Used to move a connected OCPP 2.1 station from ws:// to TLS. Empty:
    # wss://<ocpp route host> when the gateway serves HTTPS, otherwise unset (the
    # upgrade is refused). Set it to the TLS LoadBalancer address for SP3 mTLS.
    stationTlsUrl: ""
    # Address other pods use to reach the API (API_BASE_URL), e.g. the worker's
    # conformance runs. Empty: http://<release>-api:<api.port>.
    internalUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Background Worker ---
worker:
  enabled: true
  # Single replica by default. Safe to scale up: BullMQ job schedulers and
  # deterministic job ids run each cron tick and bridged event once across
  # replicas. Keep one replica when octtOcspResponderUrl is set.
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  env:
    # OCTT conformance runs started from the dashboard: the URL at which the OCPP
    # pods reach the Test System OCSP responder the worker starts during a run
    # (it listens on the URL's port, e.g. http://<worker pod or service>:7110/ocsp).
    # The run adds the host to pnc.ocsp.allowedPrivateHosts while it runs.
    # Empty: the OCSP tests (TC_C_50, TC_C_51, TC_C_52, TC_M_24) are skipped.
    octtOcspResponderUrl: ""
  # A 0.5 vCPU worker ran at 72 to 94% CPU with 400 sessions charging
  # (2026-10-09 AWS benchmark). The CDK prod config runs it on 1 vCPU / 2 GB.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # CPU target is a percentage of resources.requests.cpu.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPP WebSocket Service ---
ocpp:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7103
  healthPort: 8081
  # TLS for station connections. Enables SP3 mTLS (client cert validation).
  # SP0-SP2 stations can also connect on this port (no client cert required).
  # Creates a LoadBalancer Service on port 8443 for direct station access.
  # Requires a TLS Secret with tls.crt, tls.key, and ca.crt.
  tls:
    enabled: true
    port: 8443
    certSecret: ""
    # Annotations for the TLS LoadBalancer Service (e.g. AWS NLB config).
    serviceAnnotations: {}
  env:
    logLevel: info
    maxConnectionsPerIp: 2500
    maxMessagesPerIpPerSecond: 5000
    # Station connection authentications after a reconnect wave, so it cannot
    # fill the database pool. Empty keeps the server default: half of the
    # pool (DB_POOL_MAX) at once, 1000 queued, 10000 ms wait. Over the
    # queue or the wait the station gets 503 with Retry-After and retries.
    # Keep authMaxConcurrent below the pool size; raise the pool instead.
    authMaxConcurrent: ""
    authMaxQueued: ""
    authMaxWaitMs: ""
    # Comma-separated CIDRs of proxies (e.g. the ingress gateway pod range) whose
    # X-Forwarded-For (station IP) and X-Forwarded-Proto (TLS) headers are trusted.
    # Security profile 2 stations behind a TLS-terminating ingress need this set.
    # Empty trusts no proxy.
    trustedProxyCidrs: ""
    # Address other pods use to reach the OCPP server (OCPP_SERVER_URL): the
    # worker's conformance runs, the simulator, and station pairing in the API.
    # Empty: ws://<release>-ocpp:<ocpp.port>.
    internalUrl: ""
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 4Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPI Service ---
ocpi:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7104
  env:
    logLevel: info
    baseUrl: ""
    countryCode: US
    partyId: EVT
    businessName: EVtivity
    website: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- CSMS Frontend ---
csms:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7100
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Portal Frontend ---
portal:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7101
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Charging Station Simulator ---
css:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  healthPort: 8082
  env:
    mode: standby
    actionIntervalMs: "1000"
    stationPassword: "password"
    stationLimit: "0"
    tlsRejectUnauthorized: "false"
  # Mount SP3 test certificates from a Kubernetes secret.
  # Secret must contain: client.pem, client-key.pem, ca.pem
  tls:
    enabled: false
    certSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPI eMSP Simulator ---
ocpiSim:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7105
  env:
    role: emsp
    baseUrl: ""
    countryCode: NL
    partyId: SIM
    name: OCPI Simulator
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPI CPO Simulator ---
ocpiCpoSim:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7106
  env:
    role: cpo
    baseUrl: ""
    countryCode: DE
    partyId: CPO
    name: OCPI CPO Simulator
    autoSession: "true"
    sessionInterval: "60"
    sessionDuration: "30"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Initial Admin User ---
# Creates an admin user on first install with mustResetPassword=true.
# The user must change their password on first login.
initialAdmin:
  enabled: true
  email: "admin@evtivity.local"
  password: ""  # Required. Set via --set or install script generates one.

# --- Demo Data Seed Job (post-install) ---
# Seeds the full demo dataset: 20 sites, 2000 simulator stations, drivers,
# sessions, payments, support cases. This is TEST DATA and is NOT suitable
# for production deployments. Both flags must be set to true for the job to
# run; `confirmed` is a deliberate second acknowledgement of that warning.
# The job is idempotent and skips generation when any non-baseline site or
# station already exists.
seedDemo:
  enabled: false
  confirmed: false

# --- Payments ---
# Allows the simulated (test) payment provider in the API, OCPP and worker
# (PAYMENTS_ALLOW_SIMULATED). It moves no money, so keep it false in production.
# Required when seedDemo is enabled: demo drivers have simulated cards.
payments:
  allowSimulatedProvider: false

# --- Notification test sink ---
# The CSMS can send driver SMS and push to a local test service instead of
# Twilio and Expo (NOTIFICATIONS_ALLOW_TEST_SINK, NOTIFICATIONS_TEST_SINK_URL).
# It is for the local Docker Compose stack only. The chart always sets
# NOTIFICATIONS_ALLOW_TEST_SINK to "false" and fails the render when
# notifications.allowTestSink, notifications.testSinkUrl, or
# <api|ocpp|worker|ocpi>.env.notificationsAllowTestSink / notificationsTestSinkUrl is set.

# --- Database Migration Job ---
migrate:
  image:
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Gateway API ---
# Requires a Gateway API implementation (Envoy Gateway, Istio, etc).
gatewayAPI:
  enabled: true
  # Create a Gateway resource. Set to false to reference an existing Gateway.
  gateway:
    create: true
    gatewayClassName: istio
    annotations: {}
    listeners:
      - name: http
        hostname: "*.evtivity.local"
        port: 80
        protocol: HTTP
  # Reference to the parent Gateway. Required when gateway.create is false.
  # When gateway.create is true and this is empty, auto-references the created Gateway.
  parentRefs: []
  # HTTPRoute definitions. One HTTPRoute per entry.
  annotations: {}
  routes:
    - host: csms.evtivity.local
      rules:
        - path: /
          service: csms
    - host: ocpp.evtivity.local
      rules:
        - path: /
          service: ocpp
    - host: portal.evtivity.local
      rules:
        - path: /
          service: portal
    - host: api.evtivity.local
      rules:
        - path: /
          service: api
    - host: ocpi.evtivity.local
      rules:
        - path: /
          service: ocpi

# --- Istio Service Mesh ---
# Creates PeerAuthentication and AuthorizationPolicy resources.
# Only used when Istio is the gateway implementation.
istio:
  enabled: false
  peerAuthentication:
    mode: STRICT    # STRICT, PERMISSIVE, or DISABLE

# --- Secrets ---
# By default the chart creates a Secret from the values below.
# To use an existing Secret (Vault, Sealed Secrets, ExternalSecrets), set:
#   create: false
#   existingSecret: "my-evtivity-secrets"
# Your Secret must contain: DATABASE_URL, REDIS_URL_API, REDIS_URL_OCPP, REDIS_URL_OCPI,
# REDIS_URL_WORKER, REDIS_URL_CSS, JWT_SECRET, SETTINGS_ENCRYPTION_KEY
secrets:
  create: true
  existingSecret: ""
  databaseUrl: ""
  # One Redis URL per service. Each service connects as its own Redis ACL user
  # (users and permissions in redis/acl-rules.conf), e.g.
  # redis://api:<password>@evtivity-redis-master:6379. scripts/install.sh creates
  # the users in the bundled Redis and sets these. Required for every enabled service.
  redisUrls:
    api: ""
    ocpp: ""
    ocpi: ""
    worker: ""
    css: ""
  jwtSecret: ""
  settingsEncryptionKey: ""

# --- External Dependencies ---
# PostgreSQL and Redis must be installed separately.
# Set the service hostnames so init containers can wait for them.
dependencies:
  postgresHost: ""
  postgresPort: 5432
  # Connections each api, ocpp, ocpi, worker and css pod pools (DB_POOL_MAX).
  # Keep the sum over all pods (HPA at maxReplicas, plus one migrate or seed
  # job) below the PostgreSQL max_connections minus its reserved connections
  # (stock PostgreSQL: 100 - 3). Defaults: 3 pods, 30 connections. With HPA at
  # 5 api and 5 ocpp pods: 120, so raise max_connections or lower this.
  # The OCPP server authenticates at most half its pool of stations at once.
  postgresPoolMax: 10
  redisHost: ""
  redisPort: 6379

# --- Redis TLS ---
# Opt in when Redis serves TLS with a private CA, such as the bundled Redis that
# scripts/install.sh sets up with REDIS_TLS=true. The services trust the CA from
# caSecret, and every secrets.redisUrls.* must be rediss://. A Redis with a
# certificate from a public CA needs only rediss:// URLs, not this setting.
redisTls:
  enabled: false
  # Secret holding the CA certificate that signed the Redis server certificate
  # (install.sh: <release>-redis-tls; cert-manager: the Certificate's secret).
  caSecret: ""
  caKey: ca.crt

# --- Redis ACL sync ---
# A pre-install/pre-upgrade hook applies redis/acl-rules.conf to the service
# users (keys, channels, commands; passwords unchanged) and persists it, so a
# release that adds a key prefix or channel works right after the upgrade
# (README, "Redis Access Control"). It connects to dependencies.redisHost as the
# admin user. Without the admin password Secret it changes nothing.
redisAcl:
  sync:
    enabled: true
  admin:
    user: default
    passwordSecret:
      # Empty: <release>-redis, the Secret of the bundled Bitnami Redis.
      name: ""
      key: redis-password
  # Secret or ConfigMap the Redis loads its ACL file from at start. Empty name:
  # the bundled Bitnami Redis objects (<release>-redis-acl Secret, then
  # <release>-redis-configuration ConfigMap); without them the job runs ACL SAVE
  # (Redis with an aclfile) or CONFIG REWRITE.
  aclFile:
    kind: Secret
    name: ""
    key: users.acl

# --- Credential Rotation ---
# Rotates the PostgreSQL and Redis passwords of the services on a schedule (README,
# "Credential Rotation"). Off by default: it needs admin credentials for both
# servers, and the Redis must keep ACL changes across restarts.
# When enabled, a pre-install/pre-upgrade hook copies DATABASE_URL and the
# REDIS_URL_* values into the Secret <fullname>-credentials once. From then on
# that Secret is the source of truth for those connections: the services read it,
# the rotation job updates it, and later changes to secrets.databaseUrl or
# secrets.redisUrls are ignored. Before turning rotation off, copy its current
# values back into secrets.* (DATABASE_URL takes MIGRATE_DATABASE_URL).
credentialRotation:
  enabled: false
  # Cron schedule of the rotation job (default: 03:00 on the 1st of each month).
  schedule: "0 3 1 * *"
  # IANA time zone of the schedule. Empty uses the controller's zone (usually UTC).
  timeZone: ""
  # Pauses the schedule without removing the job.
  suspend: false
  # Time each restarted Deployment has to finish its rollout. A rollout that
  # does not finish fails the run and keeps the old credentials valid.
  rolloutTimeoutSeconds: 900
  # Wait after the rollouts before the old credentials are removed, so pods in
  # their termination grace period finish with a working credential.
  revokeDelaySeconds: 120
  database:
    # Alternating application logins: <appUser> and <appUser>_clone, members of
    # groupRole. The pods move off the owner role at the first rotation.
    enabled: true
    appUser: evtivity_app
    groupRole: evtivity_app_group
    # Also rotate the owner password (used only by the migrate and seed jobs).
    rotateOwner: true
    # PostgreSQL user that creates the logins and changes passwords: a
    # superuser, or a role with CREATEROLE and ADMIN on groupRole. The bundled
    # Bitnami PostgreSQL: user postgres, Secret <release>-postgresql, key
    # postgres-password. Its password is not rotated.
    admin:
      user: postgres
      passwordSecret:
        name: ""
        key: postgres-password
  redis:
    # Each service user gets a second password, the pods restart, then the
    # old password is removed. Needs ACL SETUSER and CONFIG GET as the admin user
    # and a single primary (ACL changes do not replicate).
    enabled: true
    # Redis admin user. The bundled Bitnami Redis: user default, Secret
    # <release>-redis, key redis-password. Its password is not rotated.
    admin:
      user: default
      passwordSecret:
        name: ""
        key: redis-password
    # Secret or ConfigMap holding the ACL file that Redis loads at start. The
    # job writes the rotated passwords into it, so a Redis restart keeps them.
    # Required for the bundled Bitnami Redis, which rebuilds its ACL file from
    # it on every restart: chart 27 and later, Secret <release>-redis-acl;
    # earlier charts, ConfigMap <release>-redis-configuration (key users.acl in
    # both). Leave name empty for a Redis that loads a writable aclfile: the job
    # runs ACL SAVE instead.
    aclFile:
      kind: Secret
      name: ""
      key: users.acl
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Application Settings ---
# Settings seeded into the database on every install and upgrade.
# All settings remain editable via the admin UI.
# Helm values are the source of truth: they overwrite DB values on every deploy.
# Empty string values are skipped (not inserted), preserving any existing DB value.
# Large content (logos, HTML templates, legal docs) is UI-only.
appSettings:
  system:
    name: "EVtivity CSMS"
    timezone: "America/New_York"
  ocpp:
    heartbeatInterval: 300
    meterValueInterval: 60
    clockAlignedInterval: 900
    sampledMeasurands: "Energy.Active.Import.Register,Power.Active.Import,Voltage,SoC,Current.Import"
    alignedMeasurands: "Energy.Active.Import.Register,Power.Active.Import,Voltage,SoC,Current.Import"
    txEndedMeasurands: "Energy.Active.Import.Register"
    connectionTimeout: 120
    resetRetries: 3
    offlineCommandTtlHours: 24
    registrationPolicy: "approval-required"
    commandRetryMaxAttempts: 3
    commandRetryBaseDelayMs: 1000
    commandRetryMaxDelayMs: 30000
  company:
    name: "EVtivity"
    # The platform's one currency (ISO 4217, two-decimal). Leave empty to keep
    # the value set in Settings > Company; a fresh install starts at USD.
    currency: ""
    # Whether the driver portal shows prices including ("gross") or excluding
    # ("net") tax for guests and drivers who have not chosen. Leave empty to keep
    # the value set in Settings > Company; a fresh install starts at net.
    priceDisplay: ""
    # Whether tariff prices are entered excluding tax ("net", tax is added) or
    # including tax ("gross", tax is taken out). Leave empty to keep the value set
    # in Settings > Company; a fresh install starts at net.
    taxBasis: ""
    contactEmail: "contact@evtivity.local"
    supportEmail: "support@evtivity.local"
    supportPhone: "+1 (555) 123-4567"
    street: "100 Market Street"
    city: "San Francisco"
    state: "CA"
    zip: "94105"
    country: "US"
    metaDescription: "EV charging station management"
    metaKeywords: "EV, charging, OCPP"
    ogImage: ""
    portalUrl: ""
    themeColor: "#2563eb"
  pricing:
    splitBillingEnabled: true
  stationMessage:
    enabled: false
    pricingFormat: "compact"
    chargingRefreshSeconds: 30
    brandLine: ""
    # Display language of every station (en, de, es, ko, zh, zh-TW). Leave empty
    # to keep the value set in Settings > Messages; a fresh install starts at en.
    language: ""
  maintenance:
    defaultMessageTemplate: "This site is temporarily unavailable for maintenance. {{reason}}"
  idling:
    gracePeriodMinutes: 30
  prepaid:
    # Prepaid card balance, in cents of the company currency, below which a
    # debit sends the driver the low credit notice. 0 turns the notice off.
    lowCreditThresholdCents: 500
  invoice:
    # Days from issue to the due date of a new invoice (0 to 365). Leave empty to
    # keep the value set in Settings > Payment (30 on a fresh install).
    paymentTermsDays: ""
  fleet:
    # Day of the month (1 to 28, system timezone) from which the monthly run
    # invoices the previous month for every fleet with automatic monthly invoice.
    # Leave empty to keep the value set in Settings > Payment (1 on a fresh install).
    invoiceRunDay: ""
    # Fleet credit, in cents of the company currency, that an account session of
    # a fleet with a credit limit reserves at its start and adds each time its
    # cost nears the reservation (1 to 100000000). Leave empty to keep the value
    # set in Settings > Integrations > Fleet (5000 on a fresh install).
    creditReservationCents: ""
  pdf:
    # Logo on every PDF the platform generates (invoices, credit notes, fleet
    # invoices, reports): a PNG or SVG data URI (data:image/png;base64,... or
    # data:image/svg+xml;base64,...) of at most 512 KB. Prefer uploading it in
    # Settings > Company: an SVG uploaded there is cleaned of scripts and
    # external references, and a large value here counts toward the 1 MiB
    # ConfigMap limit. Leave empty to keep the value set in the dashboard (the
    # default EVtivity logo on a fresh install).
    logo: ""
    # Plain text shown centered at the bottom of every PDF page, exactly as
    # entered and not translated (at most 5 lines and 500 characters). Leave
    # empty to keep the value set in Settings > Company (www.evtivity.com on a
    # fresh install). A value set here replaces the dashboard value on every
    # upgrade.
    footer: ""
  session:
    staleTimeoutHours: 24
    # Connection timeout (seconds) assumed for a station that has not reported
    # TxCtrlr.EVConnectionTimeOut (2.1) or ConnectionTimeOut (1.6). A portal or
    # guest start with no EV plugged in is closed this long (plus 60 s) after
    # the station accepted it: the session fails and the card hold is released.
    evConnectionTimeoutSeconds: 180
  notifications:
    emailEnabled: true
    # Private hostnames or IPs notification webhooks may reach (max 20)
    webhookAllowedPrivateHosts: []
  sustainability:
    gridEmissionFactor: "0.386"
    evEfficiency: "3.3"
    gasolineEmissionFactor: "8.887"
    avgMpg: "25.4"
  googleMaps:
    defaultLat: "39.8283"
    defaultLng: "-98.5795"
    defaultZoom: "4"
  smartCharging:
    iso15118Enabled: true
    defaultMaxPowerW: 22000
  sentry:
    enabled: false
    environment: "production"
  # Operator AI assistant. provider: anthropic, openai, gemini or deepseek.
  # effort: reasoning effort, low, medium or high; leave empty to keep the
  # value set in the dashboard (the provider default on a fresh install).
  # temperature, topP and topK were removed: the chart refuses them.
  chatbotAi:
    enabled: false
    provider: "anthropic"
    model: ""
    effort: ""
    systemPrompt: ""
  features:
    roamingEnabled: false
    pncEnabled: false
    reservationEnabled: true
    reservationBufferMinutes: 0
    reservationCancellationWindowMinutes: 0
    reservationCancellationFeeCents: 0
    fleetEnabled: true
    supportEnabled: true
    guestEnabled: true
  security:
    autoDisableOnCritical: true
    recaptchaEnabled: false
    recaptchaThreshold: 0.5
    mfaEmailEnabled: true
    mfaTotpEnabled: true
    mfaSmsEnabled: false
  portal:
    registrationEnabled: true
  mobile:
    attestation:
      enabled: false
      iosTeamId: ""
      iosBundleId: ""
      iosEnvironment: development
      androidCloudProjectNumber: ""
      androidPackageName: ""
      androidServiceAccount: ""
    # The operator's mobile app builds (mobile repo brands/index.js). The API
    # accepts a card 3D Secure return URL from the app (Adyen) only when it
    # leads back to one of them. urlSchemes: the brand scheme (iOS returns to
    # <scheme>://). androidPackageNames: the brand androidPackage (the Adyen
    # Android SDK returns to adyencheckout://<application id>). Defaults match
    # the default brand.
    app:
      urlSchemes:
        - evtivity
      androidPackageNames:
        - com.evtivity.driver
  audit:
    retentionDays: 1095
  refreshTokens:
    retentionDays: 30
  logs:
    accessRetentionDays: 30
    ocppMessageRetentionDays: 30
    domainEventsRetentionDays: 30
    meterValuesRetentionDays: 90
    connectionRetentionDays: 90
    notificationsRetentionDays: 90
    securityEventsRetentionDays: 365
    portStatusRetentionDays: 30
    workerJobRetentionDays: 30
  # Support case AI. provider and effort take the same values as chatbotAi.
  # tone: professional, friendly or formal.
  # temperature, topP and topK were removed: the chart refuses them.
  supportAi:
    enabled: false
    provider: ""
    model: ""
    effort: ""
    systemPrompt: ""
    tone: "professional"
  # Settings shared by every AI feature. Leave a value empty to keep the one
  # set in the dashboard; the migration sets the fresh-install default named
  # in each comment. Provider API keys go in sensitive.ai*ApiKey.
  ai:
    # Provider API base URL, for a proxy or gateway. Must start with https://.
    # Empty on a fresh install (the provider's public API).
    anthropic:
      baseUrl: ""
    openai:
      baseUrl: ""
    gemini:
      baseUrl: ""
    deepseek:
      baseUrl: ""
    rateLimit:
      # AI messages per user per minute, 1 to 1000 (fresh install: 10).
      userPerMinute: ""
      # Support AI drafts per site per minute (the support case's site),
      # 1 to 100000 (fresh install: 60).
      sitePerMinute: ""
    budget:
      # Tokens per user per day, 0 to 10000000000, 0 for no limit
      # (fresh install: 2000000).
      userDailyTokens: ""
    # Tool calls the model may make in one reply, 1 to 100 (fresh install: 20).
    maxToolCallsPerTurn: ""
    # Days a conversation is kept after its last message, 1 to 3650
    # (fresh install: 30).
    conversationRetentionDays: ""
    attachments:
      # Largest attachment in bytes, 1 to 33554432 (fresh install: 10485760).
      maxBytes: ""
      # Attachments per message, 1 to 20 (fresh install: 5).
      maxPerMessage: ""
  sso:
    enabled: false
    provider: ""
    entryPoint: ""
    issuer: "evtivity-csms"
    autoProvision: false
    defaultRoleId: ""
    attributeMapping: '{"email":"email","firstName":"firstName","lastName":"lastName"}'
  pnc:
    # manual, hubject, or local (the CSMS issues ISO 15118 contract
    # certificates from its own contract CA, created in Settings > Plug & Charge)
    provider: "manual"
    # eMAID prefix of the contracts the local contract CA issues: ISO 3166-1
    # alpha-2 country code and a 3 character provider ID (empty: set in Settings)
    localEmaidCountry: ""
    localEmaidProviderId: ""
    expirationWarningDays: 30
    expirationCriticalDays: 7
    # Private hostnames or IPs the CSMS may call as OCSP responders (max 20)
    ocspAllowedPrivateHosts: []
  smtp:
    host: ""
    port: ""
    username: ""
    from: ""
  ftp:
    host: ""
    port: ""
    username: ""
    path: ""
  s3:
    bucket: ""
    region: ""
  payments:
    # Provider for new payments: none (payments off), stripe, or simulated
    # (needs payments.allowSimulatedProvider). Leave empty to keep the value set in
    # Settings > Payment; a fresh install starts at none, or stripe when a Stripe
    # secret key is already stored. Adyen is selected only in Settings > Payment,
    # after the upgrade: the chart refuses adyen here.
    provider: ""
    # Default pre-authorization amount in cents (1 to 1000000). Leave empty to
    # keep the value set in Settings > Payment (5000 on a fresh install).
    preAuthAmountCents: ""
    # Default platform fee percentage (0 to 100). Leave empty to keep the value
    # set in Settings > Payment (0 on a fresh install).
    platformFeePercent: ""
  # Test (simulated) payment provider, used only when payments.allowSimulatedProvider
  # is true. Leave a value empty to keep the one set in Settings > Payment.
  simulated:
    # sync (Stripe-like, results in the API response) or async (Adyen-like,
    # results confirmed later through the payment webhook pipeline)
    resultMode: ""
    # Delay of async results in seconds (0 to 3600)
    asyncDelaySeconds: ""
    # Failure rate of test cards without a scenario (0 to 1)
    randomFailureRate: ""
  # Adyen payment provider. Leave a value empty to keep the one set in
  # Settings > Payment. Secrets go in sensitive.adyen*.
  adyen:
    merchantAccount: ""
    # Adyen public client key (not a secret). Its allowed origins must list the
    # portal and CSMS URLs.
    clientKey: ""
    # test or live
    environment: ""
    # Required when live: Customer Area > Developers > API URLs > Prefix,
    # for example 1797a841fbb37ca7-AdyenDemo.
    liveUrlPrefix: ""
    # Live endpoint region of the client SDKs: eu, us, au, nea or in.
    liveRegion: ""
    # Basic auth username configured on the Adyen webhook.
    webhookUsername: ""
    # true only after Adyen enables pre-authorization adjustment for the
    # merchant category; otherwise a shortfall is a second charge.
    authorisationAdjustment: ""

  # Sensitive settings. Pass via --set flags. Never commit values here.
  # To use an external Secret (Vault, Sealed Secrets, ExternalSecrets), set:
  #   sensitive.existingSecret: "my-secret-name"
  # The Secret must have key: sensitive-settings.json containing a JSON object
  # mapping DB keys to plaintext values (e.g., {"smtp.password": "secret"}).
  sensitive:
    existingSecret: ""
    smtpPassword: ""
    ftpPassword: ""
    twilioAccountSid: ""
    twilioAuthToken: ""
    twilioFromNumber: ""
    s3AccessKeyId: ""
    s3SecretAccessKey: ""
    stripeSecretKey: ""
    stripePublishableKey: ""
    # Signing secrets (whsec_...) of the two Stripe webhook endpoints that
    # Settings > Payment > Stripe > Create webhook makes: the platform endpoint
    # (payment events) and the Connect endpoint (account.updated of site host
    # accounts). Both send to /v1/webhooks/payments/stripe.
    stripeWebhookSecret: ""
    stripeConnectWebhookSecret: ""
    adyenApiKey: ""
    # Hex HMAC key of the Adyen webhook, and the previous one during a rotation.
    adyenHmacKey: ""
    adyenHmacKeyPrevious: ""
    adyenWebhookPassword: ""
    recaptchaSiteKey: ""
    recaptchaSecretKey: ""
    googleMapsApiKey: ""
    pncHubjectBaseUrl: ""
    pncHubjectTokenUrl: ""
    pncHubjectClientId: ""
    pncHubjectClientSecret: ""
    marketingGtagPortal: ""
    marketingGtagCsms: ""
    ssoCert: ""
    # AI provider API keys, shared by every AI feature (ai.<provider>.apiKeyEnc).
    # supportAiApiKey and chatbotAiApiKey were removed: the chart refuses them.
    aiAnthropicApiKey: ""
    aiOpenaiApiKey: ""
    aiGeminiApiKey: ""
    aiDeepseekApiKey: ""
    sentryDsn: ""

# --- Monitoring (Prometheus + Grafana) ---
monitoring:
  enabled: false
  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.2.1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 15d
    scrapeInterval: 60s
    storage:
      size: 10Gi
  grafana:
    image:
      repository: grafana/grafana
      tag: "11.5.2"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    storage:
      size: 5Gi
    adminPassword: admin
  loki:
    enabled: false
    image:
      repository: grafana/loki
      tag: "3.4.2"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 168h
    storage:
      size: 10Gi
  alloy:
    enabled: false
    image:
      repository: grafana/alloy
      tag: "v1.8.1"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
