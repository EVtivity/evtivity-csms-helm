# EVtivity CSMS Helm Chart Values

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/evtivity/evtivity-csms
  # Accepts semver eg: "1.2.3", defaults to Chart.appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# --- API Service ---
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7102
  env:
    logLevel: info
    nodeEnv: production
    corsOrigin: ""
    rateLimitMax: 3000
    rateLimitWindow: "1 minute"
    authRateLimitMax: 30
    authRateLimitWindow: "1 minute"
    metricsPort: "9091"
    cookieDomain: ""
    # Public wss:// address stations use for security profiles 2 and 3, without the
    # station ID. Used to move a connected OCPP 2.1 station from ws:// to TLS. Empty:
    # wss://<ocpp route host> when the gateway serves HTTPS, otherwise unset (the
    # upgrade is refused). Set it to the TLS LoadBalancer address for SP3 mTLS.
    stationTlsUrl: ""
    # Address other pods use to reach the API (API_BASE_URL), e.g. the worker's
    # conformance runs. Empty: http://<release>-api:<api.port>.
    internalUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Background Worker ---
worker:
  enabled: true
  # Single replica by default. Safe to scale up - BullMQ handles exactly-once delivery.
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  env:
    # OCTT conformance runs started from the dashboard: the URL at which the OCPP
    # pods reach the Test System OCSP responder the worker starts during a run
    # (it listens on the URL's port, e.g. http://<worker pod or service>:7110/ocsp).
    # The run adds the host to pnc.ocsp.allowedPrivateHosts while it runs.
    # Empty: the OCSP tests (TC_C_50, TC_C_51, TC_C_52, TC_M_24) are skipped.
    octtOcspResponderUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPP WebSocket Service ---
ocpp:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7103
  healthPort: 8081
  # TLS for station connections. Enables SP3 mTLS (client cert validation).
  # SP0-SP2 stations can also connect on this port (no client cert required).
  # Creates a LoadBalancer Service on port 8443 for direct station access.
  # Requires a TLS Secret with tls.crt, tls.key, and ca.crt.
  tls:
    enabled: true
    port: 8443
    certSecret: ""
    # Annotations for the TLS LoadBalancer Service (e.g. AWS NLB config).
    serviceAnnotations: {}
  env:
    logLevel: info
    maxConnectionsPerIp: 2500
    maxMessagesPerIpPerSecond: 5000
    # Station connection authentications after a reconnect wave, so it cannot
    # fill the database pool. Empty keeps the server default: half of the
    # pool (DB_POOL_MAX) at once, 1000 queued, 10000 ms wait. Over the
    # queue or the wait the station gets 503 with Retry-After and retries.
    # Keep authMaxConcurrent below the pool size; raise the pool instead.
    authMaxConcurrent: ""
    authMaxQueued: ""
    authMaxWaitMs: ""
    # Comma-separated CIDRs of proxies (e.g. the ingress gateway pod range) whose
    # X-Forwarded-For (station IP) and X-Forwarded-Proto (TLS) headers are trusted.
    # Security profile 2 stations behind a TLS-terminating ingress need this set.
    # Empty trusts no proxy.
    trustedProxyCidrs: ""
    # Address other pods use to reach the OCPP server (OCPP_SERVER_URL): the
    # worker's conformance runs, the simulator, and station pairing in the API.
    # Empty: ws://<release>-ocpp:<ocpp.port>.
    internalUrl: ""
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 4Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPI Service ---
ocpi:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7104
  env:
    logLevel: info
    baseUrl: ""
    countryCode: US
    partyId: EVT
    businessName: EVtivity
    website: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- CSMS Frontend ---
csms:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7100
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Portal Frontend ---
portal:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7101
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Charging Station Simulator ---
css:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  healthPort: 8082
  env:
    mode: standby
    actionIntervalMs: "1000"
    stationPassword: "password"
    stationLimit: "0"
    tlsRejectUnauthorized: "false"
  # Mount SP3 test certificates from a Kubernetes secret.
  # Secret must contain: client.pem, client-key.pem, ca.pem
  tls:
    enabled: false
    certSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPI eMSP Simulator ---
ocpiSim:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7105
  env:
    role: emsp
    baseUrl: ""
    countryCode: NL
    partyId: SIM
    name: OCPI Simulator
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- OCPI CPO Simulator ---
ocpiCpoSim:
  enabled: false
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  port: 7106
  env:
    role: cpo
    baseUrl: ""
    countryCode: DE
    partyId: CPO
    name: OCPI CPO Simulator
    autoSession: "true"
    sessionInterval: "60"
    sessionDuration: "30"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- Initial Admin User ---
# Creates an admin user on first install with mustResetPassword=true.
# The user must change their password on first login.
initialAdmin:
  enabled: true
  email: "admin@evtivity.local"
  password: ""  # Required. Set via --set or install script generates one.

# --- Demo Data Seed Job (post-install) ---
# Seeds the full demo dataset: 20 sites, 2000 simulator stations, drivers,
# sessions, payments, support cases. This is TEST DATA and is NOT suitable
# for production deployments. Both flags must be set to true for the job to
# run; `confirmed` is a deliberate second acknowledgement of that warning.
# The job is idempotent and skips generation when any non-baseline site or
# station already exists.
seedDemo:
  enabled: false
  confirmed: false

# --- Payments ---
# Allows the simulated (test) payment provider in the API, OCPP and worker
# (PAYMENTS_ALLOW_SIMULATED). It moves no money, so keep it false in production.
# Required when seedDemo is enabled: demo drivers have simulated cards.
payments:
  allowSimulatedProvider: false

# --- Database Migration Job ---
migrate:
  image:
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Gateway API ---
# Requires a Gateway API implementation (Envoy Gateway, Istio, etc).
gatewayAPI:
  enabled: true
  # Create a Gateway resource. Set to false to reference an existing Gateway.
  gateway:
    create: true
    gatewayClassName: istio
    annotations: {}
    listeners:
      - name: http
        hostname: "*.evtivity.local"
        port: 80
        protocol: HTTP
  # Reference to the parent Gateway. Required when gateway.create is false.
  # When gateway.create is true and this is empty, auto-references the created Gateway.
  parentRefs: []
  # HTTPRoute definitions. One HTTPRoute per entry.
  annotations: {}
  routes:
    - host: csms.evtivity.local
      rules:
        - path: /
          service: csms
    - host: ocpp.evtivity.local
      rules:
        - path: /
          service: ocpp
    - host: portal.evtivity.local
      rules:
        - path: /
          service: portal
    - host: api.evtivity.local
      rules:
        - path: /
          service: api
    - host: ocpi.evtivity.local
      rules:
        - path: /
          service: ocpi

# --- Istio Service Mesh ---
# Creates PeerAuthentication and AuthorizationPolicy resources.
# Only used when Istio is the gateway implementation.
istio:
  enabled: false
  peerAuthentication:
    mode: STRICT    # STRICT, PERMISSIVE, or DISABLE

# --- Secrets ---
# By default the chart creates a Secret from the values below.
# To use an existing Secret (Vault, Sealed Secrets, ExternalSecrets), set:
#   create: false
#   existingSecret: "my-evtivity-secrets"
# Your Secret must contain: DATABASE_URL, REDIS_URL, JWT_SECRET, SETTINGS_ENCRYPTION_KEY
secrets:
  create: true
  existingSecret: ""
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
  settingsEncryptionKey: ""

# --- External Dependencies ---
# PostgreSQL and Redis must be installed separately.
# Set the service hostnames so init containers can wait for them.
dependencies:
  postgresHost: ""
  postgresPort: 5432
  # Connections each api, ocpp, ocpi, worker and css pod pools (DB_POOL_MAX).
  # Keep the sum over all pods (HPA at maxReplicas, plus one migrate or seed
  # job) below the PostgreSQL max_connections minus its reserved connections
  # (stock PostgreSQL: 100 - 3). Defaults: 3 pods, 30 connections. With HPA at
  # 5 api and 5 ocpp pods: 120, so raise max_connections or lower this.
  # The OCPP server authenticates at most half its pool of stations at once.
  postgresPoolMax: 10
  redisHost: ""
  redisPort: 6379

# --- Application Settings ---
# Settings seeded into the database on every install and upgrade.
# All settings remain editable via the admin UI.
# Helm values are the source of truth: they overwrite DB values on every deploy.
# Empty string values are skipped (not inserted), preserving any existing DB value.
# Large content (logos, HTML templates, legal docs) is UI-only.
appSettings:
  system:
    name: "EVtivity CSMS"
    timezone: "America/New_York"
  ocpp:
    heartbeatInterval: 300
    meterValueInterval: 60
    clockAlignedInterval: 900
    sampledMeasurands: "Energy.Active.Import.Register,Power.Active.Import,Voltage,SoC,Current.Import"
    alignedMeasurands: "Energy.Active.Import.Register,Power.Active.Import,Voltage,SoC,Current.Import"
    txEndedMeasurands: "Energy.Active.Import.Register"
    connectionTimeout: 120
    resetRetries: 3
    offlineCommandTtlHours: 24
    registrationPolicy: "approval-required"
    commandRetryMaxAttempts: 3
    commandRetryBaseDelayMs: 1000
    commandRetryMaxDelayMs: 30000
  company:
    name: "EVtivity"
    # The platform's one currency (ISO 4217, two-decimal). Leave empty to keep
    # the value set in Settings > Company; a fresh install starts at USD.
    currency: ""
    # Whether the driver portal shows prices including ("gross") or excluding
    # ("net") tax for guests and drivers who have not chosen. Leave empty to keep
    # the value set in Settings > Company; a fresh install starts at net.
    priceDisplay: ""
    # Whether tariff prices are entered excluding tax ("net", tax is added) or
    # including tax ("gross", tax is taken out). Leave empty to keep the value set
    # in Settings > Company; a fresh install starts at net.
    taxBasis: ""
    contactEmail: "contact@evtivity.local"
    supportEmail: "support@evtivity.local"
    supportPhone: "+1 (555) 123-4567"
    street: "100 Market Street"
    city: "San Francisco"
    state: "CA"
    zip: "94105"
    country: "US"
    metaDescription: "EV charging station management"
    metaKeywords: "EV, charging, OCPP"
    ogImage: ""
    portalUrl: ""
    themeColor: "#2563eb"
  pricing:
    splitBillingEnabled: true
  stationMessage:
    enabled: false
    pricingFormat: "compact"
    chargingRefreshSeconds: 30
    brandLine: ""
    # Display language of every station (en, de, es, ko, zh, zh-TW). Leave empty
    # to keep the value set in Settings > Messages; a fresh install starts at en.
    language: ""
  maintenance:
    defaultMessageTemplate: "This site is temporarily unavailable for maintenance. {{reason}}"
  idling:
    gracePeriodMinutes: 30
  session:
    staleTimeoutHours: 24
    # Connection timeout (seconds) assumed for a station that has not reported
    # TxCtrlr.EVConnectionTimeOut (2.1) or ConnectionTimeOut (1.6). A portal or
    # guest start with no EV plugged in is closed this long (plus 60 s) after
    # the station accepted it: the session fails and the card hold is released.
    evConnectionTimeoutSeconds: 180
  notifications:
    emailEnabled: true
  sustainability:
    gridEmissionFactor: "0.386"
    evEfficiency: "3.3"
    gasolineEmissionFactor: "8.887"
    avgMpg: "25.4"
  googleMaps:
    defaultLat: "39.8283"
    defaultLng: "-98.5795"
    defaultZoom: "4"
  smartCharging:
    iso15118Enabled: true
    defaultMaxPowerW: 22000
  sentry:
    enabled: false
    environment: "production"
  chatbotAi:
    enabled: false
    provider: "anthropic"
    model: ""
    temperature: ""
    topP: ""
    topK: ""
    systemPrompt: ""
  features:
    roamingEnabled: false
    pncEnabled: false
    reservationEnabled: true
    reservationBufferMinutes: 0
    reservationCancellationWindowMinutes: 0
    reservationCancellationFeeCents: 0
    fleetEnabled: true
    supportEnabled: true
    guestEnabled: true
  security:
    autoDisableOnCritical: true
    recaptchaEnabled: false
    recaptchaThreshold: 0.5
    mfaEmailEnabled: true
    mfaTotpEnabled: true
    mfaSmsEnabled: false
  portal:
    registrationEnabled: true
  mobile:
    attestation:
      enabled: false
      iosTeamId: ""
      iosBundleId: ""
      iosEnvironment: development
      androidCloudProjectNumber: ""
      androidPackageName: ""
      androidServiceAccount: ""
    # The operator's mobile app builds (mobile repo brands/index.js). The API
    # accepts a card 3D Secure return URL from the app (Adyen) only when it
    # leads back to one of them. urlSchemes: the brand scheme (iOS returns to
    # <scheme>://). androidPackageNames: the brand androidPackage (the Adyen
    # Android SDK returns to adyencheckout://<application id>). Defaults match
    # the default brand.
    app:
      urlSchemes:
        - evtivity
      androidPackageNames:
        - com.evtivity.driver
  audit:
    retentionDays: 1095
  refreshTokens:
    retentionDays: 30
  logs:
    accessRetentionDays: 30
    ocppMessageRetentionDays: 30
    domainEventsRetentionDays: 30
    meterValuesRetentionDays: 90
    connectionRetentionDays: 90
    notificationsRetentionDays: 90
    securityEventsRetentionDays: 365
    portStatusRetentionDays: 30
    workerJobRetentionDays: 30
  supportAi:
    enabled: false
    provider: ""
    model: ""
    temperature: ""
    topP: ""
    topK: ""
    systemPrompt: ""
    tone: "professional"
  sso:
    enabled: false
    provider: ""
    entryPoint: ""
    issuer: "evtivity-csms"
    autoProvision: false
    defaultRoleId: ""
    attributeMapping: '{"email":"email","firstName":"firstName","lastName":"lastName"}'
  pnc:
    provider: "manual"
    expirationWarningDays: 30
    expirationCriticalDays: 7
    # Private hostnames or IPs the CSMS may call as OCSP responders (max 20)
    ocspAllowedPrivateHosts: []
  smtp:
    host: ""
    port: ""
    username: ""
    from: ""
  ftp:
    host: ""
    port: ""
    username: ""
    path: ""
  s3:
    bucket: ""
    region: ""
  payments:
    # Provider for new payments: none (payments off), stripe, or simulated
    # (needs payments.allowSimulatedProvider). Leave empty to keep the value set in
    # Settings > Payment; a fresh install starts at none, or stripe when a Stripe
    # secret key is already stored. Adyen is selected only in Settings > Payment,
    # after the upgrade: the chart refuses adyen here.
    provider: ""
    # Default pre-authorization amount in cents (1 to 1000000). Leave empty to
    # keep the value set in Settings > Payment (5000 on a fresh install).
    preAuthAmountCents: ""
    # Default platform fee percentage (0 to 100). Leave empty to keep the value
    # set in Settings > Payment (0 on a fresh install).
    platformFeePercent: ""
  # Test (simulated) payment provider, used only when payments.allowSimulatedProvider
  # is true. Leave a value empty to keep the one set in Settings > Payment.
  simulated:
    # sync (Stripe-like, results in the API response) or async (Adyen-like,
    # results confirmed later through the payment webhook pipeline)
    resultMode: ""
    # Delay of async results in seconds (0 to 3600)
    asyncDelaySeconds: ""
    # Failure rate of test cards without a scenario (0 to 1)
    randomFailureRate: ""
  # Adyen payment provider. Leave a value empty to keep the one set in
  # Settings > Payment. Secrets go in sensitive.adyen*.
  adyen:
    merchantAccount: ""
    # Adyen public client key (not a secret). Its allowed origins must list the
    # portal and CSMS URLs.
    clientKey: ""
    # test or live
    environment: ""
    # Required when live: Customer Area > Developers > API URLs > Prefix,
    # for example 1797a841fbb37ca7-AdyenDemo.
    liveUrlPrefix: ""
    # Live endpoint region of the client SDKs: eu, us, au, nea or in.
    liveRegion: ""
    # Basic auth username configured on the Adyen webhook.
    webhookUsername: ""
    # true only after Adyen enables pre-authorization adjustment for the
    # merchant category; otherwise a shortfall is a second charge.
    authorisationAdjustment: ""

  # Sensitive settings. Pass via --set flags. Never commit values here.
  # To use an external Secret (Vault, Sealed Secrets, ExternalSecrets), set:
  #   sensitive.existingSecret: "my-secret-name"
  # The Secret must have key: sensitive-settings.json containing a JSON object
  # mapping DB keys to plaintext values (e.g., {"smtp.password": "secret"}).
  sensitive:
    existingSecret: ""
    smtpPassword: ""
    ftpPassword: ""
    twilioAccountSid: ""
    twilioAuthToken: ""
    twilioFromNumber: ""
    s3AccessKeyId: ""
    s3SecretAccessKey: ""
    stripeSecretKey: ""
    stripePublishableKey: ""
    # Signing secrets (whsec_...) of the two Stripe webhook endpoints that
    # Settings > Payment > Stripe > Create webhook makes: the platform endpoint
    # (payment events) and the Connect endpoint (account.updated of site host
    # accounts). Both send to /v1/webhooks/payments/stripe.
    stripeWebhookSecret: ""
    stripeConnectWebhookSecret: ""
    adyenApiKey: ""
    # Hex HMAC key of the Adyen webhook, and the previous one during a rotation.
    adyenHmacKey: ""
    adyenHmacKeyPrevious: ""
    adyenWebhookPassword: ""
    recaptchaSiteKey: ""
    recaptchaSecretKey: ""
    googleMapsApiKey: ""
    pncHubjectBaseUrl: ""
    pncHubjectTokenUrl: ""
    pncHubjectClientId: ""
    pncHubjectClientSecret: ""
    marketingGtagPortal: ""
    marketingGtagCsms: ""
    ssoCert: ""
    supportAiApiKey: ""
    chatbotAiApiKey: ""
    sentryDsn: ""

# --- Monitoring (Prometheus + Grafana) ---
monitoring:
  enabled: false
  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.2.1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 15d
    scrapeInterval: 60s
    storage:
      size: 10Gi
  grafana:
    image:
      repository: grafana/grafana
      tag: "11.5.2"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    storage:
      size: 5Gi
    adminPassword: admin
  loki:
    enabled: false
    image:
      repository: grafana/loki
      tag: "3.4.2"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 168h
    storage:
      size: 10Gi
  alloy:
    enabled: false
    image:
      repository: grafana/alloy
      tag: "v1.8.1"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
