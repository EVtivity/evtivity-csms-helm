{{- if .Values.initialAdmin.enabled }}
{{- if not .Values.initialAdmin.password }}
{{- fail "initialAdmin.password is required when initialAdmin.enabled is true. Set via --set initialAdmin.password=<value>." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-seed-admin
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "seed-admin") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "seed-admin") | nindent 8 }}
    spec:
      securityContext:
        {{- include "evtivity-csms.podSecurityContext" (dict "uid" 1000) | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          securityContext:
            {{- include "evtivity-csms.containerSecurityContext" . | nindent 12 }}
          command: ['sh', '-c', 'until nc -z {{ .Values.dependencies.postgresHost }} {{ .Values.dependencies.postgresPort }}; do echo "waiting for postgres..."; sleep 2; done']
      containers:
        - name: seed-admin
          image: {{ include "evtivity-csms.image" (dict "context" . "component" "migrate" "values" .Values.migrate) }}
          imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
          securityContext:
            {{- include "evtivity-csms.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Runs the same script the CDK invokes via `aws ecs run-task`.
          # Source: packages/database/src/seed-admin.ts (shipped in the migrate image).
          command: ['sh', '-c', 'cd packages/database && npm run seed:admin']
          env:
            # Read-only root filesystem: npm writes its cache and logs under /tmp.
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/.npm
            - name: npm_config_update_notifier
              value: "false"
            - name: INITIAL_ADMIN_EMAIL
              value: {{ .Values.initialAdmin.email | quote }}
            - name: INITIAL_ADMIN_PASSWORD
              value: {{ .Values.initialAdmin.password | quote }}
            {{- include "evtivity-csms.ownerDatabaseUrlEnv" . | nindent 12 }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
