{{- $r := include "evtivity-csms.credentialRotation" . | fromYaml }}
{{- if $r.enabled }}
{{- $fullname := include "evtivity-csms.fullname" . }}
{{- if not $r.schedule }}
{{- fail "credentialRotation.schedule is required while credentialRotation.enabled is true." }}
{{- end }}
{{- if lt (int64 $r.rolloutTimeoutSeconds) 60 }}
{{- fail "credentialRotation.rolloutTimeoutSeconds must be at least 60." }}
{{- end }}
{{- if lt (int64 $r.revokeDelaySeconds) 0 }}
{{- fail "credentialRotation.revokeDelaySeconds must not be negative." }}
{{- end }}
{{- if and $r.database.enabled (not $r.database.admin.passwordSecret.name) }}
{{- fail "credentialRotation.database.admin.passwordSecret.name is required while credentialRotation.database.enabled is true (bundled PostgreSQL: <release>-postgresql)." }}
{{- end }}
{{- if and $r.database.enabled (or (not $r.database.appUser) (not $r.database.groupRole)) }}
{{- fail "credentialRotation.database.appUser and groupRole are required while credentialRotation.database.enabled is true." }}
{{- end }}
{{- if and $r.redis.enabled (not $r.redis.admin.passwordSecret.name) }}
{{- fail "credentialRotation.redis.admin.passwordSecret.name is required while credentialRotation.redis.enabled is true (bundled Redis: <release>-redis)." }}
{{- end }}
{{- $deployments := list }}
{{- range $component := splitList "," (include "evtivity-csms.credentialComponents" .) }}
{{- if $component }}
{{- $deployments = append $deployments (printf "%s-%s" $fullname $component) }}
{{- end }}
{{- end }}
{{- $acl := $r.redis.aclFile }}
{{- $aclEnabled := and $r.redis.enabled $acl.name }}
{{- if and $aclEnabled (not (has $acl.kind (list "Secret" "ConfigMap"))) }}
{{- fail "credentialRotation.redis.aclFile.kind must be Secret or ConfigMap." }}
{{- end }}
{{- $secrets := list (include "evtivity-csms.credentialsSecretName" .) }}
{{- if and $aclEnabled (eq $acl.kind "Secret") }}
{{- $secrets = append $secrets $acl.name }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-credential-rotation
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credential-rotation") | nindent 4 }}
data:
  credential-rotation.mjs: |-
    {{- .Files.Get "files/credential-rotation.mjs" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-credential-rotation
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credential-rotation") | nindent 4 }}
---
# Only the credentials Secret, the Redis ACL file object, and the Deployments
# of this release. The admin passwords reach the job as env vars.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-credential-rotation
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credential-rotation") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $secrets | nindent 6 }}
    verbs: ["get", "patch"]
  {{- if and $aclEnabled (eq $acl.kind "ConfigMap") }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $acl.name | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
  {{- if $deployments }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      {{- toYaml $deployments | nindent 6 }}
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-credential-rotation
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credential-rotation") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-credential-rotation
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-credential-rotation
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-credential-rotation
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credential-rotation") | nindent 4 }}
spec:
  schedule: {{ $r.schedule | quote }}
  {{- with $r.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ $r.suspend }}
  # One run at a time. A run that fails is not retried at once: the next run
  # finishes what it left (see files/credential-rotation.mjs).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "credential-rotation") | nindent 8 }}
    spec:
      backoffLimit: 0
      # Up to two rollouts (an unfinished one, then the new one) and two waits.
      activeDeadlineSeconds: {{ add (mul 2 (int64 $r.rolloutTimeoutSeconds)) (mul 2 (int64 $r.revokeDelaySeconds)) 600 }}
      template:
        metadata:
          labels:
            {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "credential-rotation") | nindent 12 }}
          annotations:
            # The job talks to the Kubernetes API, PostgreSQL and Redis only. A
            # mesh sidecar would keep the pod running after the job ends.
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: {{ $fullname }}-credential-rotation
          restartPolicy: Never
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "evtivity-csms.rotationPodSecurityContext" . | nindent 12 }}
          containers:
            - name: credential-rotation
              image: {{ include "evtivity-csms.image" (dict "context" . "component" "migrate" "values" .Values.migrate) }}
              imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
              command: ["node", "/opt/evtivity/credential-rotation.mjs"]
              securityContext:
                {{- include "evtivity-csms.rotationContainerSecurityContext" . | nindent 16 }}
              env:
                - name: MODE
                  value: rotate
                - name: CREDENTIALS_SECRET
                  value: {{ include "evtivity-csms.credentialsSecretName" . }}
                - name: COMPONENTS
                  value: {{ include "evtivity-csms.credentialComponents" . | quote }}
                - name: DEPLOYMENTS
                  value: {{ join "," $deployments | quote }}
                - name: ROLLOUT_TIMEOUT_SECONDS
                  value: {{ int64 $r.rolloutTimeoutSeconds | quote }}
                - name: REVOKE_DELAY_SECONDS
                  value: {{ int64 $r.revokeDelaySeconds | quote }}
                - name: ROTATE_DATABASE
                  value: {{ $r.database.enabled | quote }}
                {{- if $r.database.enabled }}
                - name: ROTATE_OWNER
                  value: {{ $r.database.rotateOwner | quote }}
                - name: DB_APP_USER
                  value: {{ $r.database.appUser | quote }}
                - name: DB_GROUP_ROLE
                  value: {{ $r.database.groupRole | quote }}
                - name: PG_ADMIN_USER
                  value: {{ $r.database.admin.user | quote }}
                - name: PG_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $r.database.admin.passwordSecret.name }}
                      key: {{ $r.database.admin.passwordSecret.key }}
                {{- end }}
                - name: ROTATE_REDIS
                  value: {{ $r.redis.enabled | quote }}
                {{- if $r.redis.enabled }}
                - name: REDIS_ADMIN_USER
                  value: {{ $r.redis.admin.user | quote }}
                - name: REDIS_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $r.redis.admin.passwordSecret.name }}
                      key: {{ $r.redis.admin.passwordSecret.key }}
                {{- if $aclEnabled }}
                - name: REDIS_ACL_KIND
                  value: {{ $acl.kind | quote }}
                - name: REDIS_ACL_NAME
                  value: {{ $acl.name | quote }}
                - name: REDIS_ACL_KEY
                  value: {{ $acl.key | quote }}
                {{- end }}
                {{- if .Values.redisTls.enabled }}
                - name: REDIS_TLS_CA_PEM
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "redisTls.caSecret is required when redisTls.enabled is true" .Values.redisTls.caSecret }}
                      key: {{ .Values.redisTls.caKey }}
                {{- end }}
                {{- end }}
              volumeMounts:
                - name: script
                  mountPath: /opt/evtivity
                  readOnly: true
              {{- with $r.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: script
              configMap:
                name: {{ $fullname }}-credential-rotation
          {{- with $r.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $r.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $r.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
