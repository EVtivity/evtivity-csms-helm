apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-migrate
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "migrate") | nindent 4 }}
  annotations:
    # Upgrade: runs before Helm updates the Deployments, so new pods never start
    # against the old schema. It reads the ConfigMap and Secret of the installed
    # release (it needs only DATABASE_URL). Install: runs after the Secret exists.
    # seed-settings (weight 1) and the post-install seed jobs run after it.
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "migrate") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ['sh', '-c', 'until nc -z {{ .Values.dependencies.postgresHost }} {{ .Values.dependencies.postgresPort }}; do echo "waiting for postgres..."; sleep 2; done']
      containers:
        - name: migrate
          image: {{ include "evtivity-csms.image" (dict "context" . "component" "migrate" "values" .Values.migrate) }}
          imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
          envFrom:
            - configMapRef:
                name: {{ include "evtivity-csms.configMapName" . }}
            - secretRef:
                name: {{ include "evtivity-csms.secretName" . }}
          {{- if .Values.credentialRotation.enabled }}
          # The owner credential from the credentials Secret wins over the
          # chart Secret's DATABASE_URL.
          env:
            {{- include "evtivity-csms.ownerDatabaseUrlEnv" . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
