{{- /*
The migration runs before the Deployments on install and on upgrade
(pre-install, pre-upgrade). On install the chart's ConfigMap and Secret do not
exist yet, so the job reads DATABASE_URL from a hook Secret rendered from
secrets.databaseUrl (removed after the hooks succeed), from
secrets.existingSecret, or, with credential rotation, from the credentials
Secret that credentials-init (weight -10) creates. PostgreSQL is a separate
release or external, so it is reachable before this chart's resources exist.
*/}}
{{- $rotation := (.Values.credentialRotation | default dict).enabled }}
{{- $dbSecret := include "evtivity-csms.secretName" . }}
{{- if and .Values.secrets.create (not $rotation) }}
{{- $dbSecret = printf "%s-migrate-env" (include "evtivity-csms.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecret }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-migrate
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "migrate") | nindent 4 }}
  annotations:
    # Runs before Helm creates or updates the Deployments, so pods never start
    # against an old or empty schema, and helm install --wait does not wait on
    # pods that need the migration. A failed migration fails the release with
    # the old pods running. seed-settings and the post-install seed jobs run
    # after it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "migrate") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ['sh', '-c', 'until nc -z {{ .Values.dependencies.postgresHost }} {{ .Values.dependencies.postgresPort }}; do echo "waiting for postgres..."; sleep 2; done']
      containers:
        - name: migrate
          image: {{ include "evtivity-csms.image" (dict "context" . "component" "migrate" "values" .Values.migrate) }}
          imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
          # Only what the migration reads: the chart ConfigMap and Secret do not
          # exist yet on install.
          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.nodeEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.api.env.logLevel | quote }}
            - name: DB_POOL_MAX
              value: {{ .Values.dependencies.postgresPoolMax | default 10 | quote }}
            {{- if $rotation }}
            {{- include "evtivity-csms.ownerDatabaseUrlEnv" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: DATABASE_URL
            {{- end }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
