      "stationMessage.pricingFormat": {{ .Values.appSettings.stationMessage.pricingFormat | toJson }},
      "stationMessage.charging.refreshSeconds": {{ .Values.appSettings.stationMessage.chargingRefreshSeconds | toJson }},
      "stationMessage.brandLine": {{ .Values.appSettings.stationMessage.brandLine | toJson }},
      "stationMessage.language": {{ .Values.appSettings.stationMessage.language | default "" | toJson }},
      "maintenance.defaultMessageTemplate": {{ .Values.appSettings.maintenance.defaultMessageTemplate | toJson }},
      "idling.gracePeriodMinutes": {{ .Values.appSettings.idling.gracePeriodMinutes | toJson }},
      "prepaid.lowCreditThresholdCents": {{ atoi $lowCreditThresholdCents }},
      "invoice.paymentTermsDays": {{ if eq $paymentTermsDays "" }}""{{ else }}{{ atoi $paymentTermsDays }}{{ end }},
      "session.staleTimeoutHours": {{ .Values.appSettings.session.staleTimeoutHours | toJson }},
