      "mobile.attestation.android.serviceAccountEnc": {{ .Values.appSettings.mobile.attestation.androidServiceAccount | toJson }},
      "mobile.app.urlSchemes": {{ $mobileUrlSchemes | toJson }},
      "mobile.app.androidPackageNames": {{ $mobileAndroidPackages | toJson }},
      "audit.retentionDays": {{ .Values.appSettings.audit.retentionDays | toJson }},
      "refreshTokens.retentionDays": {{ .Values.appSettings.refreshTokens.retentionDays | toJson }},
      "logs.access.retentionDays": {{ .Values.appSettings.logs.accessRetentionDays | toJson }},
      "logs.ocppMessage.retentionDays": {{ .Values.appSettings.logs.ocppMessageRetentionDays | toJson }},
      "logs.domainEvents.retentionDays": {{ .Values.appSettings.logs.domainEventsRetentionDays | toJson }},
