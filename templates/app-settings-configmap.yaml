      "ocpp.commandRetryMaxDelayMs": {{ .Values.appSettings.ocpp.commandRetryMaxDelayMs | toJson }},
      "company.name": {{ .Values.appSettings.company.name | toJson }},
      "company.currency": {{ .Values.appSettings.company.currency | toJson }},
      "company.priceDisplay": {{ .Values.appSettings.company.priceDisplay | default "" | toJson }},
