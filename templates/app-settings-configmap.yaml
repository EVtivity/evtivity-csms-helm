      "fleet.enabled": {{ .Values.appSettings.features.fleetEnabled | toJson }},
      "fleet.creditReservationCents": {{ if eq $creditReservationCents "" }}""{{ else }}{{ atoi $creditReservationCents }}{{ end }},
      "fleet.invoiceRunDay": {{ if eq $invoiceRunDay "" }}""{{ else }}{{ atoi $invoiceRunDay }}{{ end }},
