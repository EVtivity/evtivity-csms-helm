      "company.supportEmail": {{ .Values.appSettings.company.supportEmail | toJson }},
      "company.supportPhone": {{ .Values.appSettings.company.supportPhone | toJson }},
      "company.street": {{ .Values.appSettings.company.street | toJson }},
      "company.city": {{ .Values.appSettings.company.city | toJson }},
      "company.state": {{ .Values.appSettings.company.state | toJson }},
      "company.zip": {{ .Values.appSettings.company.zip | toJson }},
      "company.country": {{ .Values.appSettings.company.country | toJson }},
      "company.metaDescription": {{ .Values.appSettings.company.metaDescription | toJson }},
      "company.metaKeywords": {{ .Values.appSettings.company.metaKeywords | toJson }},
      "company.ogImage": {{ .Values.appSettings.company.ogImage | toJson }},
