{{- $stripeCurrency := (.Values.appSettings.stripe | default dict).currency | default "" }}
{{- $pricingCurrency := (.Values.appSettings.pricing | default dict).currency | default "" }}
{{- if or (ne (toString $stripeCurrency) "") (ne (toString $pricingCurrency) "") }}
{{- fail "appSettings.stripe.currency and appSettings.pricing.currency were removed: the platform runs in one currency. Set appSettings.company.currency instead, or leave it empty to keep the current value." }}
{{- end }}
{{- $supported := list "USD" "EUR" "GBP" "CAD" "AUD" "CHF" "CNY" "INR" "BRL" "MXN" "SEK" "NOK" "DKK" "NZD" "SGD" "HKD" "ZAR" "ILS" "AED" "SAR" "TWD" "THB" "PLN" "CZK" "HUF" "TRY" "COP" "ARS" "PHP" "MYR" "IDR" }}
{{- $currency := .Values.appSettings.company.currency | default "" }}
{{- if and (ne $currency "") (not (has $currency $supported)) }}
{{- fail (printf "appSettings.company.currency %q is not supported. Use an uppercase ISO 4217 code with two decimals, for example USD or EUR." $currency) }}
{{- end }}
{{- $priceDisplay := .Values.appSettings.company.priceDisplay | default "" }}
{{- if and (ne $priceDisplay "") (not (has $priceDisplay (list "gross" "net"))) }}
{{- fail (printf "appSettings.company.priceDisplay %q is not supported. Use gross or net." $priceDisplay) }}
{{- end }}
{{- $taxBasis := .Values.appSettings.company.taxBasis | default "" }}
{{- if and (ne $taxBasis "") (not (has $taxBasis (list "gross" "net"))) }}
{{- fail (printf "appSettings.company.taxBasis %q is not supported. Use net or gross." $taxBasis) }}
{{- end }}
{{- $stripeSettings := .Values.appSettings.stripe | default dict }}
{{- range $key := list "preAuthAmountCents" "platformFeePercent" }}
{{- if and (hasKey $stripeSettings $key) (not (kindIs "invalid" (get $stripeSettings $key))) (ne (toString (get $stripeSettings $key)) "") }}
{{- fail (printf "appSettings.stripe.%s moved to appSettings.payments.%s: the setting applies to every payment provider. Remove appSettings.stripe from your values (with --reuse-values, add --set appSettings.stripe=null) and set appSettings.payments.%s if you changed it. The stored value is migrated." $key $key $key) }}
{{- end }}
{{- end }}
{{- $payments := .Values.appSettings.payments | default dict }}
{{- $preAuthAmountCents := "" }}
{{- if kindIs "float64" $payments.preAuthAmountCents }}{{ $preAuthAmountCents = ternary (toString (int64 $payments.preAuthAmountCents)) (toString $payments.preAuthAmountCents) (eq $payments.preAuthAmountCents (floor $payments.preAuthAmountCents)) }}{{ else if not (kindIs "invalid" $payments.preAuthAmountCents) }}{{ $preAuthAmountCents = toString $payments.preAuthAmountCents }}{{ end }}
{{- if and (ne $preAuthAmountCents "") (not (and (regexMatch "^[0-9]+$" $preAuthAmountCents) (ge (atoi $preAuthAmountCents) 1) (le (atoi $preAuthAmountCents) 1000000))) }}
{{- fail (printf "appSettings.payments.preAuthAmountCents %q is not supported. Use a whole number of cents from 1 to 1000000." $preAuthAmountCents) }}
{{- end }}
{{- $prepaid := .Values.appSettings.prepaid | default dict }}
{{- $lowCreditThresholdCents := "500" }}
{{- if kindIs "float64" $prepaid.lowCreditThresholdCents }}{{ $lowCreditThresholdCents = ternary (toString (int64 $prepaid.lowCreditThresholdCents)) (toString $prepaid.lowCreditThresholdCents) (eq $prepaid.lowCreditThresholdCents (floor $prepaid.lowCreditThresholdCents)) }}{{ else if not (kindIs "invalid" $prepaid.lowCreditThresholdCents) }}{{ $lowCreditThresholdCents = toString $prepaid.lowCreditThresholdCents }}{{ end }}
{{- if not (and (regexMatch "^[0-9]+$" $lowCreditThresholdCents) (le (atoi $lowCreditThresholdCents) 100000000)) }}
{{- fail (printf "appSettings.prepaid.lowCreditThresholdCents %q is not supported. Use a whole number of cents from 0 to 100000000 (0 turns the low credit notice off)." $lowCreditThresholdCents) }}
{{- end }}
{{- $invoice := .Values.appSettings.invoice | default dict }}
{{- $paymentTermsDays := "" }}
{{- if kindIs "float64" $invoice.paymentTermsDays }}{{ $paymentTermsDays = ternary (toString (int64 $invoice.paymentTermsDays)) (toString $invoice.paymentTermsDays) (eq $invoice.paymentTermsDays (floor $invoice.paymentTermsDays)) }}{{ else if not (kindIs "invalid" $invoice.paymentTermsDays) }}{{ $paymentTermsDays = toString $invoice.paymentTermsDays }}{{ end }}
{{- if and (ne $paymentTermsDays "") (not (and (regexMatch "^[0-9]+$" $paymentTermsDays) (le (atoi $paymentTermsDays) 365))) }}
{{- fail (printf "appSettings.invoice.paymentTermsDays %q is not supported. Use a whole number of days from 0 to 365." $paymentTermsDays) }}
{{- end }}
{{- $fleet := .Values.appSettings.fleet | default dict }}
{{- $invoiceRunDay := "" }}
{{- if kindIs "float64" $fleet.invoiceRunDay }}{{ $invoiceRunDay = ternary (toString (int64 $fleet.invoiceRunDay)) (toString $fleet.invoiceRunDay) (eq $fleet.invoiceRunDay (floor $fleet.invoiceRunDay)) }}{{ else if not (kindIs "invalid" $fleet.invoiceRunDay) }}{{ $invoiceRunDay = toString $fleet.invoiceRunDay }}{{ end }}
{{- if and (ne $invoiceRunDay "") (not (and (regexMatch "^[0-9]+$" $invoiceRunDay) (ge (atoi $invoiceRunDay) 1) (le (atoi $invoiceRunDay) 28))) }}
{{- fail (printf "appSettings.fleet.invoiceRunDay %q is not supported. Use a whole day of the month from 1 to 28." $invoiceRunDay) }}
{{- end }}
{{- $creditReservationCents := "" }}
{{- if kindIs "float64" $fleet.creditReservationCents }}{{ $creditReservationCents = ternary (toString (int64 $fleet.creditReservationCents)) (toString $fleet.creditReservationCents) (eq $fleet.creditReservationCents (floor $fleet.creditReservationCents)) }}{{ else if not (kindIs "invalid" $fleet.creditReservationCents) }}{{ $creditReservationCents = toString $fleet.creditReservationCents }}{{ end }}
{{- if and (ne $creditReservationCents "") (not (and (regexMatch "^[0-9]+$" $creditReservationCents) (ge (atoi $creditReservationCents) 1) (le (atoi $creditReservationCents) 100000000))) }}
{{- fail (printf "appSettings.fleet.creditReservationCents %q is not supported. Use a whole number of cents from 1 to 100000000." $creditReservationCents) }}
{{- end }}
{{- $platformFeePercent := "" }}
{{- if or (kindIs "float64" $payments.platformFeePercent) (kindIs "int64" $payments.platformFeePercent) (kindIs "int" $payments.platformFeePercent) }}{{ $platformFeePercent = printf "%f" (float64 $payments.platformFeePercent) }}{{ else if not (kindIs "invalid" $payments.platformFeePercent) }}{{ $platformFeePercent = toString $payments.platformFeePercent }}{{ end }}
{{- if and (ne $platformFeePercent "") (not (and (regexMatch "^[0-9]+(\\.[0-9]+)?$" $platformFeePercent) (le (float64 $platformFeePercent) 100.0))) }}
{{- fail (printf "appSettings.payments.platformFeePercent %v is not supported. Use a number from 0 to 100." $payments.platformFeePercent) }}
{{- end }}
{{- $simulated := .Values.appSettings.simulated | default dict }}
{{- $simulatedResultMode := $simulated.resultMode | default "" | toString }}
{{- if not (has $simulatedResultMode (list "" "sync" "async")) }}
{{- fail (printf "appSettings.simulated.resultMode %q is not supported. Use sync or async." $simulatedResultMode) }}
{{- end }}
{{- $simulatedDelay := "" }}
{{- if kindIs "float64" $simulated.asyncDelaySeconds }}{{ $simulatedDelay = ternary (toString (int64 $simulated.asyncDelaySeconds)) (toString $simulated.asyncDelaySeconds) (eq $simulated.asyncDelaySeconds (floor $simulated.asyncDelaySeconds)) }}{{ else if not (kindIs "invalid" $simulated.asyncDelaySeconds) }}{{ $simulatedDelay = toString $simulated.asyncDelaySeconds }}{{ end }}
{{- if and (ne $simulatedDelay "") (not (and (regexMatch "^[0-9]+$" $simulatedDelay) (le (atoi $simulatedDelay) 3600))) }}
{{- fail (printf "appSettings.simulated.asyncDelaySeconds %q is not supported. Use a whole number of seconds from 0 to 3600." $simulatedDelay) }}
{{- end }}
{{- $simulatedFailureRate := "" }}
{{- if or (kindIs "float64" $simulated.randomFailureRate) (kindIs "int64" $simulated.randomFailureRate) (kindIs "int" $simulated.randomFailureRate) }}{{ $simulatedFailureRate = printf "%f" (float64 $simulated.randomFailureRate) }}{{ else if not (kindIs "invalid" $simulated.randomFailureRate) }}{{ $simulatedFailureRate = toString $simulated.randomFailureRate }}{{ end }}
{{- if and (ne $simulatedFailureRate "") (not (and (regexMatch "^[0-9]+(\\.[0-9]+)?$" $simulatedFailureRate) (le (float64 $simulatedFailureRate) 1.0))) }}
{{- fail (printf "appSettings.simulated.randomFailureRate %v is not supported. Use a number from 0 to 1." $simulated.randomFailureRate) }}
{{- end }}
{{- $paymentProvider := $payments.provider | default "" }}
{{- $paymentProviders := list "none" "stripe" }}
{{- if (.Values.payments | default dict).allowSimulatedProvider }}{{ $paymentProviders = append $paymentProviders "simulated" }}{{ end }}
{{- if eq $paymentProvider "adyen" }}
{{- fail "appSettings.payments.provider adyen cannot be set by the chart: this settings job runs while pods of the previous release can still run. Leave it empty and select Adyen in Settings > Payment after the upgrade." }}
{{- end }}
{{- if and (ne $paymentProvider "") (not (has $paymentProvider $paymentProviders)) }}
{{- fail (printf "appSettings.payments.provider %q is not supported. Use %s." $paymentProvider (join ", " $paymentProviders)) }}
{{- end }}
{{- $adyen := .Values.appSettings.adyen | default dict }}
{{- $adyenEnvironment := $adyen.environment | default "" }}
{{- if and (ne $adyenEnvironment "") (not (has $adyenEnvironment (list "test" "live"))) }}
{{- fail (printf "appSettings.adyen.environment %q is not supported. Use test or live." $adyenEnvironment) }}
{{- end }}
{{- $adyenLiveUrlPrefix := $adyen.liveUrlPrefix | default "" }}
{{- if and (eq $adyenEnvironment "live") (eq $adyenLiveUrlPrefix "") }}
{{- fail "appSettings.adyen.liveUrlPrefix is required when appSettings.adyen.environment is live." }}
{{- end }}
{{- if and (ne $adyenLiveUrlPrefix "") (not (regexMatch "^[a-z0-9]+-[A-Za-z0-9]+$" $adyenLiveUrlPrefix)) }}
{{- fail (printf "appSettings.adyen.liveUrlPrefix %q is not an Adyen live URL prefix, for example 1797a841fbb37ca7-AdyenDemo." $adyenLiveUrlPrefix) }}
{{- end }}
{{- $adyenLiveRegion := $adyen.liveRegion | default "" }}
{{- if and (ne $adyenLiveRegion "") (not (has $adyenLiveRegion (list "eu" "us" "au" "nea" "in"))) }}
{{- fail (printf "appSettings.adyen.liveRegion %q is not supported. Use eu, us, au, nea, or in." $adyenLiveRegion) }}
{{- end }}
{{- $adyenAdjustment := "" }}
{{- if not (kindIs "invalid" $adyen.authorisationAdjustment) }}{{ $adyenAdjustment = toString $adyen.authorisationAdjustment }}{{ end }}
{{- if and (ne $adyenAdjustment "") (not (has $adyenAdjustment (list "true" "false"))) }}
{{- fail (printf "appSettings.adyen.authorisationAdjustment %q is not supported. Use true or false." $adyenAdjustment) }}
{{- end }}
{{- $mobileApp := (.Values.appSettings.mobile | default dict).app | default dict }}
{{- $mobileUrlSchemes := $mobileApp.urlSchemes | default list }}
{{- if not (kindIs "slice" $mobileUrlSchemes) }}
{{- fail "appSettings.mobile.app.urlSchemes must be a list of the custom URL schemes of your app builds, for example [evtivity]." }}
{{- end }}
{{- range $scheme := $mobileUrlSchemes }}
{{- if or (not (regexMatch "^[a-z][a-z0-9+.-]*$" (toString $scheme))) (has (toString $scheme) (list "http" "https" "javascript" "data" "file" "about" "blob" "adyencheckout")) }}
{{- fail (printf "appSettings.mobile.app.urlSchemes entry %q is not an app URL scheme. Use the lowercase scheme of the app brand (brands/index.js scheme), not http, https or adyencheckout." (toString $scheme)) }}
{{- end }}
{{- end }}
{{- $mobileAndroidPackages := $mobileApp.androidPackageNames | default list }}
{{- if not (kindIs "slice" $mobileAndroidPackages) }}
{{- fail "appSettings.mobile.app.androidPackageNames must be a list of the Android application ids of your app builds, for example [com.evtivity.driver]." }}
{{- end }}
{{- range $package := $mobileAndroidPackages }}
{{- if not (regexMatch "^[a-zA-Z][a-zA-Z0-9_]*([.][a-zA-Z][a-zA-Z0-9_]*)+$" (toString $package)) }}
{{- fail (printf "appSettings.mobile.app.androidPackageNames entry %q is not an Android application id, for example com.evtivity.driver." (toString $package)) }}
{{- end }}
{{- end }}
{{- $stationLanguage := .Values.appSettings.stationMessage.language | default "" }}
{{- if and (ne $stationLanguage "") (not (has $stationLanguage (list "en" "de" "es" "ko" "zh" "zh-TW"))) }}
{{- fail (printf "appSettings.stationMessage.language %q is not supported. Use en, de, es, ko, zh, or zh-TW." $stationLanguage) }}
{{- end }}
{{- $aiProviders := list "anthropic" "openai" "gemini" "deepseek" }}
{{- range $section := list "chatbotAi" "supportAi" }}
{{- $aiSection := get $.Values.appSettings $section | default dict }}
{{- range $key := list "temperature" "topP" "topK" }}
{{- if and (hasKey $aiSection $key) (not (kindIs "invalid" (get $aiSection $key))) (ne (toString (get $aiSection $key)) "") }}
{{- fail (printf "appSettings.%s.%s was removed: AI models take a reasoning effort instead of sampling parameters. Remove it from your values (with --reuse-values, add --set appSettings.%s.%s=null) and set appSettings.%s.effort (low, medium, or high) if needed." $section $key $section $key $section) }}
{{- end }}
{{- end }}
{{- $aiProvider := $aiSection.provider | default "" | toString }}
{{- if and (ne $aiProvider "") (not (has $aiProvider $aiProviders)) }}
{{- fail (printf "appSettings.%s.provider %q is not supported. Use anthropic, openai, gemini, or deepseek." $section $aiProvider) }}
{{- end }}
{{- $aiEffort := $aiSection.effort | default "" | toString }}
{{- if and (ne $aiEffort "") (not (has $aiEffort (list "low" "medium" "high"))) }}
{{- fail (printf "appSettings.%s.effort %q is not supported. Use low, medium, or high." $section $aiEffort) }}
{{- end }}
{{- end }}
{{- $sensitiveSettings := .Values.appSettings.sensitive | default dict }}
{{- range $key := list "chatbotAiApiKey" "supportAiApiKey" }}
{{- if and (hasKey $sensitiveSettings $key) (not (kindIs "invalid" (get $sensitiveSettings $key))) (ne (toString (get $sensitiveSettings $key)) "") }}
{{- fail (printf "appSettings.sensitive.%s was removed: every AI feature shares one API key per provider. Remove it from your values (with --reuse-values, add --set appSettings.sensitive.%s=null) and set appSettings.sensitive.aiAnthropicApiKey, aiOpenaiApiKey, aiGeminiApiKey, or aiDeepseekApiKey for your provider." $key $key) }}
{{- end }}
{{- end }}
{{- $ai := .Values.appSettings.ai | default dict }}
{{- $aiBaseUrls := dict }}
{{- range $provider := $aiProviders }}
{{- $aiBaseUrl := (get $ai $provider | default dict).baseUrl | default "" | toString }}
{{- if and (ne $aiBaseUrl "") (not (hasPrefix "https://" $aiBaseUrl)) }}
{{- fail (printf "appSettings.ai.%s.baseUrl %q is not supported. Use an https:// URL, or leave it empty for the provider's public API." $provider $aiBaseUrl) }}
{{- end }}
{{- $_ := set $aiBaseUrls (printf "ai.%s.baseUrl" $provider) $aiBaseUrl }}
{{- end }}
{{- $aiRateLimit := $ai.rateLimit | default dict }}
{{- $aiBudget := $ai.budget | default dict }}
{{- $aiAttachments := $ai.attachments | default dict }}
{{- $aiNumberInputs := list (list "ai.rateLimit.userPerMinute" $aiRateLimit.userPerMinute 1) (list "ai.rateLimit.sitePerMinute" $aiRateLimit.sitePerMinute 1) (list "ai.budget.userDailyTokens" $aiBudget.userDailyTokens 0) (list "ai.maxToolCallsPerTurn" $ai.maxToolCallsPerTurn 1) (list "ai.conversationRetentionDays" $ai.conversationRetentionDays 1) (list "ai.attachments.maxBytes" $aiAttachments.maxBytes 1) (list "ai.attachments.maxPerMessage" $aiAttachments.maxPerMessage 1) }}
{{- $aiNumbers := dict }}
{{- range $input := $aiNumberInputs }}
{{- $aiName := index $input 0 }}
{{- $aiValue := index $input 1 }}
{{- $aiMin := index $input 2 }}
{{- $aiText := "" }}
{{- if kindIs "float64" $aiValue }}{{ $aiText = ternary (toString (int64 $aiValue)) (toString $aiValue) (eq $aiValue (floor $aiValue)) }}{{ else if not (kindIs "invalid" $aiValue) }}{{ $aiText = toString $aiValue }}{{ end }}
{{- if and (ne $aiText "") (not (and (regexMatch "^[0-9]+$" $aiText) (ge (atoi $aiText) $aiMin))) }}
{{- fail (printf "appSettings.%s %q is not supported. Use a whole number from %d." $aiName $aiText $aiMin) }}
{{- end }}
{{- $_ := set $aiNumbers $aiName $aiText }}
{{- end }}
