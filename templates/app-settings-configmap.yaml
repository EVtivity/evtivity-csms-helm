      "pnc.enabled": {{ .Values.appSettings.features.pncEnabled | toJson }},
      "reservation.enabled": {{ .Values.appSettings.features.reservationEnabled | toJson }},
      "reservation.bufferMinutes": {{ .Values.appSettings.features.reservationBufferMinutes | toJson }},
      "reservation.cancellationWindowMinutes": {{ .Values.appSettings.features.reservationCancellationWindowMinutes | toJson }},
