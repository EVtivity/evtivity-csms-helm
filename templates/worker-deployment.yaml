{{- if .Values.worker.enabled }}
{{- /* worker.autoscaling is missing after helm upgrade --reuse-values from a chart before 0.1.43. */}}
{{- $autoscaling := .Values.worker.autoscaling | default dict }}
{{- $scalesOut := or (gt (int .Values.worker.replicaCount) 1) (and $autoscaling.enabled (gt (int (dig "maxReplicas" 4 $autoscaling)) 1)) }}
{{- if and .Values.worker.env.octtOcspResponderUrl $scalesOut }}
{{- fail "worker.env.octtOcspResponderUrl needs exactly one worker replica: the OCSP responder runs in the replica that picks up the conformance run. Set worker.replicaCount to 1 and turn worker.autoscaling off, or clear the URL." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-worker
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
spec:
  {{- if not $autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "evtivity-csms.waitForDeps" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "evtivity-csms.image" (dict "context" . "component" "worker" "values" .Values.worker) }}
          imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
          envFrom:
            - configMapRef:
                name: {{ include "evtivity-csms.configMapName" . }}
            - secretRef:
                name: {{ include "evtivity-csms.secretName" . }}
          env:
            {{- include "evtivity-csms.credentialsEnv" (dict "context" . "component" "worker") | nindent 12 }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
