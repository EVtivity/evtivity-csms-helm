{{- if .Values.monitoring.enabled }}
{{- if not .Values.monitoring.grafana.adminPassword }}
{{- fail "monitoring.grafana.adminPassword is required while monitoring.enabled is true (a known default would let anyone sign in to Grafana)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-grafana
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "grafana") | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.monitoring.grafana.adminPassword | b64enc | quote }}
{{- end }}
