{{- if .Values.secrets.redisUrl }}
{{- fail "secrets.redisUrl was removed: each service now connects to Redis as its own ACL user. Set secrets.redisUrls.api, .ocpp, .ocpi, .worker and .css (see redis/acl-rules.conf and the README)." }}
{{- end }}
{{- if .Values.secrets.create }}
{{- $urls := .Values.secrets.redisUrls }}
{{- range $component := list "api" "ocpp" "ocpi" "worker" "css" }}
{{- if and (index $.Values $component).enabled (not (index $urls $component)) }}
{{- fail (printf "secrets.redisUrls.%s is required while %s.enabled is true (the Redis URL of the %s ACL user)." $component $component $component) }}
{{- end }}
{{- if and $.Values.redisTls.enabled (index $.Values $component).enabled (not (hasPrefix "rediss://" (index $urls $component))) }}
{{- fail (printf "secrets.redisUrls.%s must start with rediss:// while redisTls.enabled is true." $component) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-secrets
  labels:
    {{- include "evtivity-csms.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  REDIS_URL_API: {{ $urls.api | b64enc | quote }}
  REDIS_URL_OCPP: {{ $urls.ocpp | b64enc | quote }}
  REDIS_URL_OCPI: {{ $urls.ocpi | b64enc | quote }}
  REDIS_URL_WORKER: {{ $urls.worker | b64enc | quote }}
  REDIS_URL_CSS: {{ $urls.css | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  SETTINGS_ENCRYPTION_KEY: {{ .Values.secrets.settingsEncryptionKey | b64enc | quote }}
{{- end }}
