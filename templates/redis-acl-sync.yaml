{{- /*
Applies redis/acl-rules.conf to the service users of the Redis on every install
and upgrade (files/redis-acl-sync.mjs), before the migration (weight 0) and
before any Deployment changes, so new pods never run against the previous
release's rules. Every resource here is a hook resource, removed after the hook
succeeds. The values are read with dig, so an upgrade with --reuse-values from
a release without redisAcl still runs it with the defaults.
*/}}
{{- $ra := .Values.redisAcl | default dict }}
{{- if dig "sync" "enabled" true $ra }}
{{- $fullname := include "evtivity-csms.fullname" . }}
{{- $name := printf "%s-redis-acl-sync" $fullname }}
{{- $adminSecret := dig "admin" "passwordSecret" "name" "" $ra | default (printf "%s-redis" .Release.Name) }}
{{- $aclKind := dig "aclFile" "kind" "Secret" $ra | default "Secret" }}
{{- $aclName := dig "aclFile" "name" "" $ra }}
{{- /* The Redis server: dependencies.redisHost/redisPort, else the host of the worker URL. */}}
{{- $redisHost := .Values.dependencies.redisHost }}
{{- $redisPort := .Values.dependencies.redisPort | default 6379 }}
{{- $workerUrl := (.Values.secrets.redisUrls | default dict).worker | default "" }}
{{- if and (not $redisHost) $workerUrl }}
{{- $u := urlParse $workerUrl }}
{{- $redisHost = $u.hostname }}
{{- $hostPort := splitList ":" $u.host }}
{{- if gt (len $hostPort) 1 }}
{{- $redisPort = last $hostPort }}
{{- end }}
{{- end }}
{{- if not (has $aclKind (list "Secret" "ConfigMap")) }}
{{- fail "redisAcl.aclFile.kind must be Secret or ConfigMap." }}
{{- end }}
{{- /* Bundled Bitnami Redis: Secret <release>-redis-acl (chart 27 and later) or ConfigMap <release>-redis-configuration. */}}
{{- $secrets := list (printf "%s-redis-acl" .Release.Name) }}
{{- $configMaps := list (printf "%s-redis-configuration" .Release.Name) }}
{{- if $aclName }}
{{- if eq $aclKind "Secret" }}
{{- $secrets = list $aclName }}
{{- $configMaps = list }}
{{- else }}
{{- $secrets = list }}
{{- $configMaps = list $aclName }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "redis-acl-sync") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  redis-acl-sync.mjs: |-
    {{- .Files.Get "files/redis-acl-sync.mjs" | nindent 4 }}
  acl-rules.conf: |-
    {{- .Files.Get "redis/acl-rules.conf" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "redis-acl-sync") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
# Only the object the Redis loads its ACL file from. The admin password reaches
# the job as an env var.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "redis-acl-sync") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  {{- if $secrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $secrets | nindent 6 }}
    verbs: ["get", "patch"]
  {{- end }}
  {{- if $configMaps }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      {{- toYaml $configMaps | nindent 6 }}
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "redis-acl-sync") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "redis-acl-sync") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "redis-acl-sync") | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "evtivity-csms.rotationPodSecurityContext" . | nindent 8 }}
      containers:
        - name: redis-acl-sync
          image: {{ include "evtivity-csms.image" (dict "context" . "component" "migrate" "values" .Values.migrate) }}
          imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
          command: ["node", "/opt/evtivity/redis-acl-sync.mjs"]
          securityContext:
            {{- include "evtivity-csms.rotationContainerSecurityContext" . | nindent 12 }}
          env:
            - name: RULES_FILE
              value: /opt/evtivity/acl-rules.conf
            - name: REDIS_HOST
              value: {{ $redisHost | quote }}
            - name: REDIS_PORT
              value: {{ $redisPort | quote }}
            - name: REDIS_TLS
              value: {{ .Values.redisTls.enabled | quote }}
            - name: REDIS_ADMIN_USER
              value: {{ dig "admin" "user" "default" $ra | default "default" | quote }}
            # Optional: without it (no bundled Redis) the job changes nothing.
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: {{ dig "admin" "passwordSecret" "key" "redis-password" $ra | default "redis-password" }}
                  optional: true
            {{- if $aclName }}
            - name: REDIS_ACL_KIND
              value: {{ $aclKind | quote }}
            - name: REDIS_ACL_NAME
              value: {{ $aclName | quote }}
            {{- else }}
            - name: REDIS_ACL_CANDIDATES
              value: {{ printf "Secret/%s-redis-acl,ConfigMap/%s-redis-configuration" .Release.Name .Release.Name | quote }}
            {{- end }}
            - name: REDIS_ACL_KEY
              value: {{ dig "aclFile" "key" "users.acl" $ra | default "users.acl" | quote }}
            {{- if .Values.redisTls.enabled }}
            - name: REDIS_TLS_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ required "redisTls.caSecret is required when redisTls.enabled is true" .Values.redisTls.caSecret }}
                  key: {{ .Values.redisTls.caKey }}
            {{- end }}
          volumeMounts:
            - name: script
              mountPath: /opt/evtivity
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
{{- end }}
