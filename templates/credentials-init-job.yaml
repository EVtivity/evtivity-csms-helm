{{- if (.Values.credentialRotation | default dict).enabled }}
{{- /*
Creates the credentials Secret <fullname>-credentials before the first pod or
job needs it (pre-install and pre-upgrade, before the migration at weight 0).
It copies DATABASE_URL and the REDIS_URL_* values of the enabled services once,
and only adds keys that are missing: it never overwrites a rotated credential.
Every resource here is a hook resource, removed after the hook succeeds.
*/}}
{{- $fullname := include "evtivity-csms.fullname" . }}
{{- $name := printf "%s-credentials-init" $fullname }}
{{- $components := splitList "," (include "evtivity-csms.credentialComponents" .) | compact }}
{{- $source := include "evtivity-csms.secretName" . }}
{{- if .Values.secrets.create }}
{{- $source = printf "%s-seed" $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $source }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- range $component := $components }}
  REDIS_URL_{{ upper $component }}: {{ index $.Values.secrets.redisUrls $component | b64enc | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  credential-rotation.mjs: |-
    {{- .Files.Get "files/credential-rotation.mjs" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
# Kubernetes cannot limit create to one name, so create covers Secrets in this
# namespace. get and patch cover only the credentials Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "evtivity-csms.credentialsSecretName" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "evtivity-csms.componentSelectorLabels" (dict "context" . "component" "credentials-init") | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "evtivity-csms.rotationPodSecurityContext" . | nindent 8 }}
      containers:
        - name: credentials-init
          image: {{ include "evtivity-csms.image" (dict "context" . "component" "migrate" "values" .Values.migrate) }}
          imagePullPolicy: {{ include "evtivity-csms.imagePullPolicy" . }}
          command: ["node", "/opt/evtivity/credential-rotation.mjs"]
          securityContext:
            {{- include "evtivity-csms.rotationContainerSecurityContext" . | nindent 12 }}
          env:
            - name: MODE
              value: init
            - name: CREDENTIALS_SECRET
              value: {{ include "evtivity-csms.credentialsSecretName" . }}
            - name: COMPONENTS
              value: {{ join "," $components | quote }}
            - name: SECRET_LABELS
              value: {{ include "evtivity-csms.componentLabels" (dict "context" . "component" "credentials") | fromYaml | toJson | quote }}
            - name: SEED_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $source }}
                  key: DATABASE_URL
            {{- range $component := $components }}
            - name: SEED_REDIS_URL_{{ upper $component }}
              valueFrom:
                secretKeyRef:
                  name: {{ $source }}
                  key: REDIS_URL_{{ upper $component }}
            {{- end }}
          volumeMounts:
            - name: script
              mountPath: /opt/evtivity
              readOnly: true
          {{- with (include "evtivity-csms.credentialRotation" . | fromYaml).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
{{- end }}
