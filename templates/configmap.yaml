apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "evtivity-csms.configMapName" . }}
  labels:
    {{- include "evtivity-csms.labels" . | nindent 4 }}
data:
  {{- /* The images run in production mode; development relaxes the simulated
  payment provider, CORS "*" and private AI hosts (SH-M13). */}}
  {{- if ne (toString .Values.api.env.nodeEnv) "production" }}
  {{- fail (printf "api.env.nodeEnv must be production, got %q: development and test turn on the simulated payment provider, CORS \"*\" and private AI base URLs" (toString .Values.api.env.nodeEnv)) }}
  {{- end }}
  NODE_ENV: {{ .Values.api.env.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.api.env.logLevel | quote }}
  SEED_DEMO: {{ if and .Values.seedDemo.enabled .Values.seedDemo.confirmed }}"true"{{ else }}"false"{{ end }}
  {{- $allowSimulated := (.Values.payments | default dict).allowSimulatedProvider | default false }}
  {{- if and .Values.seedDemo.enabled .Values.seedDemo.confirmed (not $allowSimulated) }}
  {{- fail "seedDemo needs payments.allowSimulatedProvider=true: demo drivers pay with simulated cards." }}
  {{- end }}
  PAYMENTS_ALLOW_SIMULATED: {{ if $allowSimulated }}"true"{{ else }}"false"{{ end }}
  {{- /* The notification test sink (driver SMS and push to a local dev service
         instead of Twilio and Expo) is for the local Compose stack only. */}}
  {{- $notifications := .Values.notifications | default dict }}
  {{- range $key := list "allowTestSink" "testSinkUrl" }}
  {{- if hasKey $notifications $key }}
  {{- fail (printf "notifications.%s is not supported: the notification test sink is for the local development stack only. Remove it from your values." $key) }}
  {{- end }}
  {{- end }}
  {{- range $component := list "api" "ocpp" "worker" "ocpi" }}
  {{- $env := (get $.Values $component | default dict).env | default dict }}
  {{- range $key := list "notificationsAllowTestSink" "notificationsTestSinkUrl" }}
  {{- if hasKey $env $key }}
  {{- fail (printf "%s.env.%s is not supported: the notification test sink is for the local development stack only. Remove it from your values." $component $key) }}
  {{- end }}
  {{- end }}
  {{- end }}
  NOTIFICATIONS_ALLOW_TEST_SINK: "false"
  {{- /* The SIM provider mock (SIM_PROVIDER_TEST_BASE_URL points the SIM provider
         adapters at a local mock server) is for the local Compose stack only. */}}
  {{- if hasKey (.Values.simProviders | default dict) "testBaseUrl" }}
  {{- fail "simProviders.testBaseUrl is not supported: the SIM provider mock is for the local development stack only. Remove it from your values." }}
  {{- end }}
  {{- range $component := list "api" "ocpp" "worker" "ocpi" }}
  {{- $env := (get $.Values $component | default dict).env | default dict }}
  {{- if hasKey $env "simProviderTestBaseUrl" }}
  {{- fail (printf "%s.env.simProviderTestBaseUrl is not supported: the SIM provider mock is for the local development stack only. Remove it from your values." $component) }}
  {{- end }}
  {{- end }}
  {{- $proto := "http" }}
  {{- range .Values.gatewayAPI.gateway.listeners }}
    {{- if or (eq .protocol "HTTPS") (eq .protocol "TLS") }}{{ $proto = "https" }}{{ end }}
  {{- end }}
  {{- $corsOrigins := list }}
  {{- $portalHost := "" }}
  {{- $csmsHost := "" }}
  {{- $ocppHost := "" }}
  {{- range $route := .Values.gatewayAPI.routes }}
    {{- range $route.rules }}
      {{- if has .service (list "csms" "portal") }}
        {{- $corsOrigins = append $corsOrigins (printf "%s://%s" $proto $route.host) }}
      {{- end }}
      {{- if eq .service "portal" }}{{ $portalHost = $route.host }}{{ end }}
      {{- if eq .service "csms" }}{{ $csmsHost = $route.host }}{{ end }}
      {{- if eq .service "ocpp" }}{{ $ocppHost = $route.host }}{{ end }}
    {{- end }}
  {{- end }}
  {{- if $corsOrigins }}
  CORS_ORIGIN: {{ join "," $corsOrigins | quote }}
  {{- else if .Values.api.env.corsOrigin }}
  {{- range $origin := splitList "," (.Values.api.env.corsOrigin | toString) }}
  {{- if eq (trim $origin) "*" }}
  {{- fail "api.env.corsOrigin must list explicit origins: * lets every site read API replies with the user's cookies (the API refuses to start with it in production)" }}
  {{- end }}
  {{- end }}
  CORS_ORIGIN: {{ .Values.api.env.corsOrigin | quote }}
  {{- else }}
  {{- fail "CORS_ORIGIN is required. Configure gateway routes (preferred) or set api.env.corsOrigin to explicit origins." }}
  {{- end }}
  {{- if $portalHost }}
  PORTAL_URL: {{ printf "%s://%s" $proto $portalHost | quote }}
  {{- end }}
  {{- if $csmsHost }}
  CSMS_URL: {{ printf "%s://%s" $proto $csmsHost | quote }}
  {{- end }}
  {{- if .Values.api.env.stationTlsUrl }}
  OCPP_STATION_TLS_URL: {{ .Values.api.env.stationTlsUrl | quote }}
  {{- else if and (eq $proto "https") $ocppHost }}
  OCPP_STATION_TLS_URL: {{ printf "wss://%s" $ocppHost | quote }}
  {{- end }}
  {{- if .Values.api.env.cookieDomain }}
  COOKIE_DOMAIN: {{ .Values.api.env.cookieDomain | quote }}
  {{- end }}
  {{- $trustProxy := .Values.api.env.trustProxy | default "" | toString | trim }}
  {{- if regexMatch "^(?i:true|[0-9]+)$" $trustProxy }}
  {{- fail (printf "api.env.trustProxy must list proxy IPs or CIDRs, got %q (a hop count or true is refused)" $trustProxy) }}
  {{- end }}
  {{- range $entry := splitList "," $trustProxy }}
  {{- if or (regexMatch "/0+$" (trim $entry)) (include "evtivity-csms.trustsEveryIpv4" (trim $entry)) }}
  {{- fail (printf "api.env.trustProxy must not trust every address, got %q: list the proxy addresses or CIDRs" (trim $entry)) }}
  {{- end }}
  {{- end }}
  {{- /* Behind an HTTPS gateway, or one the chart does not create (its listeners are
  unknown here), the API learns the https scheme only from a trusted proxy: without
  it sign-in cookies lose Secure and SSO uses the plain binding cookie (R2-L3). */}}
  {{- if and .Values.gatewayAPI.enabled (eq $trustProxy "") (or (eq $proto "https") (not .Values.gatewayAPI.gateway.create)) }}
  {{- fail "api.env.trustProxy is required behind an HTTPS gateway or a Gateway the chart does not create: set api.env.trustProxy to the gateway pod range (for example 10.244.0.0/16), else sign-in cookies get no Secure flag and a slow SSO sign-in fails" }}
  {{- end }}
  TRUST_PROXY: {{ $trustProxy | quote }}
  {{- $webauthnRpId := .Values.api.env.webauthnRpId | default "" | toString | trim | lower }}
  {{- if ne $webauthnRpId "" }}
  {{- if not (regexMatch "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$" $webauthnRpId) }}
  {{- fail (printf "api.env.webauthnRpId must be a domain name without a scheme, port or path, got %q" $webauthnRpId) }}
  {{- end }}
  {{- if regexMatch "(^|\\.)[0-9]+$" $webauthnRpId }}
  {{- fail (printf "api.env.webauthnRpId must be a domain name, not an IP address, got %q" $webauthnRpId) }}
  {{- end }}
  {{- if and (not (contains "." $webauthnRpId)) (ne $webauthnRpId "localhost") }}
  {{- fail (printf "api.env.webauthnRpId must have at least two labels (example.com), or be localhost, got %q" $webauthnRpId) }}
  {{- end }}
  {{- if and $csmsHost (or (regexMatch "^[0-9.]+$" $csmsHost) (contains ":" $csmsHost)) }}
  {{- fail (printf "api.env.webauthnRpId cannot be set while the CSMS host %q is an IP address: passkeys need a domain name" $csmsHost) }}
  {{- end }}
  {{- if and $csmsHost (ne (lower $csmsHost) $webauthnRpId) (not (hasSuffix (printf ".%s" $webauthnRpId) (lower $csmsHost))) }}
  {{- fail (printf "api.env.webauthnRpId %q must be the CSMS host %q or a parent domain of it" $webauthnRpId $csmsHost) }}
  {{- end }}
  WEBAUTHN_RP_ID: {{ $webauthnRpId | quote }}
  {{- end }}
  API_PORT: {{ .Values.api.port | quote }}
  METRICS_PORT: {{ .Values.api.env.metricsPort | quote }}
  RATE_LIMIT_MAX: {{ .Values.api.env.rateLimitMax | quote }}
  RATE_LIMIT_WINDOW: {{ .Values.api.env.rateLimitWindow | quote }}
  AUTH_RATE_LIMIT_MAX: {{ .Values.api.env.authRateLimitMax | quote }}
  AUTH_RATE_LIMIT_WINDOW: {{ .Values.api.env.authRateLimitWindow | quote }}
  DB_POOL_MAX: {{ .Values.dependencies.postgresPoolMax | default 10 | quote }}
  OCPP_PORT: {{ .Values.ocpp.port | quote }}
  OCPP_HEALTH_PORT: {{ .Values.ocpp.healthPort | quote }}
  OCPP_MAX_CONNECTIONS_PER_IP: {{ .Values.ocpp.env.maxConnectionsPerIp | quote }}
  OCPP_MAX_MESSAGES_PER_IP_PER_SECOND: {{ .Values.ocpp.env.maxMessagesPerIpPerSecond | quote }}
  {{- range $entry := splitList "," (.Values.ocpp.env.trustedProxyCidrs | default "" | toString) }}
  {{- if or (regexMatch "/0+$" (trim $entry)) (include "evtivity-csms.trustsEveryIpv4" (trim $entry)) }}
  {{- fail (printf "ocpp.env.trustedProxyCidrs must not trust every address, got %q: list the proxy addresses or CIDRs" (trim $entry)) }}
  {{- end }}
  {{- end }}
  OCPP_TRUSTED_PROXY_CIDRS: {{ .Values.ocpp.env.trustedProxyCidrs | default "" | quote }}
  OCPP_MAX_PENDING_AUTH_PER_IP: {{ .Values.ocpp.env.maxPendingAuthPerIp | quote }}
  {{- $wsCompression := .Values.ocpp.env.wsCompression }}
  {{- if kindIs "invalid" $wsCompression }}{{ $wsCompression = true }}{{ end }}
  {{- if not (kindIs "bool" $wsCompression) }}
  {{- fail (printf "ocpp.env.wsCompression %q is not supported. Use true or false." (toString $wsCompression)) }}
  {{- end }}
  OCPP_WS_COMPRESSION: {{ $wsCompression | toString | quote }}
  {{- range $key, $name := dict "authMaxConcurrent" "OCPP_AUTH_MAX_CONCURRENT" "authMaxQueued" "OCPP_AUTH_MAX_QUEUED" "authMaxWaitMs" "OCPP_AUTH_MAX_WAIT_MS" }}
  {{- $value := get $.Values.ocpp.env $key }}
  {{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") }}
  {{- /* YAML numbers arrive as float64: print 1000000 as digits, not 1e+06. */}}
  {{- $text := ternary (toString (int64 $value)) (toString $value) (kindIs "float64" $value) }}
  {{- if not (regexMatch "^[0-9]+$" $text) }}
  {{- fail (printf "ocpp.env.%s must be a whole number, got %v" $key $value) }}
  {{- end }}
  {{ $name }}: {{ $text | quote }}
  {{- end }}
  {{- end }}
  {{- /* In-cluster addresses: conformance runs (worker), simulator, station pairing (API). */}}
  OCPP_SERVER_URL: {{ .Values.ocpp.env.internalUrl | default (printf "ws://%s-ocpp:%v" (include "evtivity-csms.fullname" .) .Values.ocpp.port) | quote }}
  API_BASE_URL: {{ .Values.api.env.internalUrl | default (printf "http://%s-api:%v" (include "evtivity-csms.fullname" .) .Values.api.port) | quote }}
  {{- if .Values.ocpp.tls.enabled }}
  OCPP_TLS_PORT: {{ .Values.ocpp.tls.port | quote }}
  {{- end }}
  {{- with (.Values.worker.env | default dict).octtOcspResponderUrl }}
  OCTT_OCSP_RESPONDER_URL: {{ . | quote }}
  {{- end }}
  OCPI_PORT: {{ .Values.ocpi.port | quote }}
  OCPI_LOG_LEVEL: {{ .Values.ocpi.env.logLevel | quote }}
  {{- if .Values.ocpi.env.baseUrl }}
  OCPI_BASE_URL: {{ .Values.ocpi.env.baseUrl | quote }}
  {{- end }}
  OCPI_COUNTRY_CODE: {{ .Values.ocpi.env.countryCode | quote }}
  OCPI_PARTY_ID: {{ .Values.ocpi.env.partyId | quote }}
  OCPI_BUSINESS_NAME: {{ .Values.ocpi.env.businessName | quote }}
  {{- if .Values.ocpi.env.website }}
  OCPI_WEBSITE: {{ .Values.ocpi.env.website | quote }}
  {{- end }}
  {{- if .Values.css.enabled }}
  CSS_HEALTH_PORT: {{ .Values.css.healthPort | quote }}
  CSS_MODE: {{ .Values.css.env.mode | quote }}
  CSS_ACTION_INTERVAL_MS: {{ .Values.css.env.actionIntervalMs | quote }}
  CSS_STATION_PASSWORD: {{ .Values.css.env.stationPassword | quote }}
  CSS_STATION_LIMIT: {{ .Values.css.env.stationLimit | quote }}
  TLS_REJECT_UNAUTHORIZED: {{ .Values.css.env.tlsRejectUnauthorized | quote }}
  {{- if .Values.ocpp.tls.enabled }}
  OCPP_TLS_SERVER_URL: "wss://{{ include "evtivity-csms.fullname" . }}-ocpp:{{ .Values.ocpp.tls.port }}"
  {{- end }}
  {{- end }}
