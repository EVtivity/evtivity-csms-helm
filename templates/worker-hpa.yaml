{{- /* dig with defaults: helm upgrade --reuse-values from a chart before 0.1.43 has no worker.autoscaling. */}}
{{- $autoscaling := .Values.worker.autoscaling | default dict }}
{{- if and .Values.worker.enabled $autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "evtivity-csms.fullname" . }}-worker
  labels:
    {{- include "evtivity-csms.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "evtivity-csms.fullname" . }}-worker
  minReplicas: {{ dig "minReplicas" 1 $autoscaling }}
  maxReplicas: {{ dig "maxReplicas" 4 $autoscaling }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ dig "targetCPUUtilization" 70 $autoscaling }}
{{- end }}
